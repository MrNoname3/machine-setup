---
# Packages to rebuild with this repository's patches and hold, as
# {source: <source package>, binary: <binary package>}; each source needs
# tools/patched-deb/patches/<source>-*.patch. The binary's archive version
# decides when to rebuild, and every binary package of the source installed
# on the host is rebuilt and held. An optional build_sources holds deb822
# entries of archives the build alone needs. keep_version: true keeps the
# archive's version, for a source also installed for another architecture
# (Mesa with Steam's i386 libraries): only the native packages are rebuilt,
# and the marker each source gets under /var/lib/patched-debs tells a patched
# build from the archive's. A source dropped from these lists goes back to the
# archive's build on the next run. Set per host.
patched_debs: []

# More packages from a group the host is in (group_vars), added to patched_debs.
patched_debs_extra: []

# The build script, shared with tools/tablet-image.
patched_debs_tool: "{{ playbook_dir }}/tools/patched-deb/build-deb.sh"

# Where the built packages stay, with <source>.build naming the version and
# patches they were built with; a run that needs that build again installs it
# from here instead of building.
patched_debs_dir: "/home/{{ primary_user }}/.cache/patched-debs"

# Install the packages patched_debs lists from the PPA (tools/patched-deb,
# "The PPA") instead of building them here; a source the PPA does not carry
# is still built. The PPA's builds are pinned above every other archive's, so
# a newer kisak, Ubuntu or Mint version waits for the PPA's rebuild of it.
patched_debs_ppa: false
patched_debs_ppa_uri: https://ppa.launchpadcontent.net/mrnoname3/machine-setup/ubuntu
patched_debs_ppa_sources: [mesa, xwayland, intel-vaapi-driver, muffin]
