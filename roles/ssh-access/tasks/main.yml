---
# ssh-access role: OpenSSH server, authorized key, and hardening.
# Codifies the access we set up by hand, plus key-only login, no root login,
# and a custom port. On Ubuntu 24.04 / Mint 22 sshd is socket-activated, so the
# Port directive is ignored until we disable ssh.socket and use ssh.service.

- name: Install OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Authorize the SSH public key for the primary user
  ansible.posix.authorized_key:
    user: "{{ primary_user }}"
    key: "{{ lookup('file', ssh_authorized_key_file) }}"
    state: present

- name: Apply SSH hardening + custom port (drop-in)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    mode: "0644"
    content: |
      # Managed by Ansible (ssh-access role)
      Port {{ ssh_port }}
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
  notify: Restart ssh service

# sshd -t refuses to run without its privilege separation directory, which only
# the first start of the service creates.
- name: Ensure sshd's privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Validate the sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false

# sshd keeps the first value it reads, so a drop-in sorting before ours can
# override it; check what sshd will actually use.
- name: Read the effective sshd settings
  ansible.builtin.command: sshd -T
  register: sshd_effective
  changed_when: false

- name: Require the hardened settings to be the effective ones
  vars:
    sshd_lines: "{{ sshd_effective.stdout_lines }}"
  ansible.builtin.assert:
    that:
      - "'port ' ~ ssh_port in sshd_lines"
      - "'permitrootlogin no' in sshd_lines"
      - "'passwordauthentication no' in sshd_lines"
      - "'kbdinteractiveauthentication no' in sshd_lines"
      - "'x11forwarding no' in sshd_lines"
    fail_msg: >-
      Another file under /etc/ssh overrides the hardening drop-in; see sshd -T
      and the files in /etc/ssh/sshd_config.d.
  when: not ansible_check_mode

- name: Disable ssh socket activation (so the Port directive controls the listener)
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped

- name: Ensure ssh.service is enabled and running
  ansible.builtin.systemd_service:
    name: ssh.service
    enabled: true
    state: started

# The firewall role later allows only ssh_port, so the restart cannot wait for
# the end of the play.
- name: Apply a pending sshd restart now
  ansible.builtin.meta: flush_handlers

# A run that failed after changing the port never ran its restart handler, and
# later runs see no change to notify it again; the listener itself is the test.
- name: Check that sshd listens on the configured port
  ansible.builtin.command: ss -ltnH "sport = :{{ ssh_port }}"
  register: ssh_listener
  changed_when: false
  check_mode: false

- name: Restart sshd when it does not listen on the configured port
  ansible.builtin.systemd_service:
    name: ssh.service
    state: restarted
  when:
    - ssh_listener.stdout | length == 0
    - not ansible_check_mode
