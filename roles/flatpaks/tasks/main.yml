---
# flatpaks role: ensure the host's Flatpak application set (system scope).
#
# Day-to-day runs need no root: when everything is already installed the module
# only inspects state. Installing something new needs root -> run with -K
# (on the desktop, where there is no passwordless sudo).

- name: Install the host's Flatpak applications (system, Flathub)
  community.general.flatpak:
    name: "{{ flatpak_apps }}"
    remote: "{{ flatpak_remote }}"
    method: system
    state: present
  when: flatpak_apps | length > 0

# A per-user override, the file `flatpak override --user` writes: it needs no
# root, and other keys in it (set with Flatseal, say) are left alone.
- name: Grant the host's Flatpak applications extra access
  community.general.ini_file:
    path: "/home/{{ primary_user }}/.local/share/flatpak/overrides/{{ item.0.app }}"
    section: Context
    option: "{{ item.1 }}"
    value: "{{ item.0[item.1] | join(';') }};"
    no_extra_spaces: true
    mode: "0644"
  become: false
  loop: "{{ flatpak_overrides | product(['filesystems', 'sockets']) | list }}"
  loop_control:
    label: "{{ item.0.app }}: {{ item.1 }}={{ item.0[item.1] | default([]) | join(', ') }}"
  when: item.1 in item.0
