---
# system-disk role: dm-crypt options of the encrypted system SSD (Bazzite).
# The image's initramfs unlocks the root from rd.luks.uuid and carries no
# crypttab, so the options go on the kernel command line, where rd.luks.options
# without a UUID applies to it; the crypttab entry gets them too, for an
# initramfs built on the machine. Both take effect at the next boot. It needs
# root, so a run without it skips the role with a notice.

- name: Check whether this run has root
  ansible.builtin.command: id -u
  register: system_disk_uid
  changed_when: false
  check_mode: false

- name: Note that the system disk was skipped (no root)
  ansible.builtin.debug:
    msg: >-
      The system-disk role needs root, so it was skipped. Run it with:
      ./scripts/apply.sh {{ inventory_hostname }} --tags system-disk -K
  when: system_disk_uid.stdout != "0"

- name: Set the system disk's dm-crypt options
  when:
    - system_disk_uid.stdout == "0"
    - ansible_facts['os_family'] != "Debian"
  vars:
    system_disk_karg: "rd.luks.options={{ system_disk_luks_options | join(',') }}"
  block:
    - name: Find the device under the root filesystem
      ansible.builtin.command: findmnt -nvo SOURCE /sysroot
      register: system_disk_source
      changed_when: false
      check_mode: false

    - name: Read its type and device-mapper name
      ansible.builtin.command: lsblk -ndo TYPE,NAME {{ system_disk_source.stdout }}
      register: system_disk_dev
      changed_when: false
      check_mode: false

    - name: Fail unless the root filesystem is on dm-crypt
      ansible.builtin.assert:
        that: system_disk_dev.stdout.split()[0] == "crypt"
        fail_msg: >-
          The root filesystem is on {{ system_disk_source.stdout }}, not on a
          dm-crypt device; take system-disk out of roles_enabled.
        quiet: true

    - name: Add the options to the root's crypttab entry
      community.general.crypttab:
        name: "{{ system_disk_dev.stdout.split()[1] }}"
        opts: "{{ system_disk_luks_options | join(',') }}"
        state: opts_present

    - name: Read the kernel arguments
      ansible.builtin.command: rpm-ostree kargs
      register: system_disk_kargs
      changed_when: false
      check_mode: false

    # One rd.luks.options at a time: with two, the last one silently wins.
    - name: Put the options on the kernel command line
      ansible.builtin.command:
        argv: >-
          {{ ['rpm-ostree', 'kargs']
             + (system_disk_kargs_old | map('regex_replace', '^', '--delete=') | list)
             + ['--append=' ~ system_disk_karg] }}
      vars:
        system_disk_kargs_old: "{{ system_disk_kargs.stdout.split() | select('match', 'rd\\.luks\\.options=') | list }}"
      when: system_disk_kargs_old != [system_disk_karg]
      changed_when: true

    # dmsetup prints the options as dm-crypt's own flags.
    - name: Read the running mapping's flags
      ansible.builtin.command: dmsetup table {{ system_disk_dev.stdout.split()[1] }}
      register: system_disk_table
      changed_when: false
      check_mode: false

    - name: Report the options that wait for a reboot
      ansible.builtin.debug:
        msg: >-
          {{ system_disk_dev.stdout.split()[1] }} runs without
          {{ system_disk_missing | join(', ') }}; the options take effect at
          the next boot.
      vars:
        system_disk_missing: >-
          {{ system_disk_luks_options
             | map('regex_replace', '^discard$', 'allow_discards')
             | map('replace', '-', '_')
             | reject('in', system_disk_table.stdout.split()[8:])
             | list }}
      when: system_disk_missing | length > 0
