---
# vscode role: install VS Code from the Microsoft apt repo (on Mint; the
# Bazzite flatpak comes from the flatpaks role), then deploy the user's
# settings and extension set to whichever variant the host runs.

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == "Debian"

- name: Download the Microsoft signing key
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/microsoft.asc
    mode: "0644"
  when: ansible_facts['os_family'] == "Debian"

- name: Dearmor the Microsoft signing key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /usr/share/keyrings/microsoft-vscode.gpg /etc/apt/keyrings/microsoft.asc
    creates: /usr/share/keyrings/microsoft-vscode.gpg
  when: ansible_facts['os_family'] == "Debian"

# The package's postinst rewrites vscode.sources in its own form on every
# upgrade unless debconf says the repository is managed elsewhere.
- name: Keep the VS Code package from rewriting its apt source
  ansible.builtin.debconf:
    name: code
    question: code/add-microsoft-repo
    value: "false"
    vtype: boolean
  when: ansible_facts['os_family'] == "Debian"

# deb822 .sources form (apt_repository is deprecated, removed in core 2.25).
# The install task below refreshes the apt cache, so a changed repo file is
# picked up without a separate update task.
- name: Add the VS Code apt repository (deb822)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/vscode.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://packages.microsoft.com/repos/code
      Suites: stable
      Components: main
      Architectures: amd64 arm64 armhf
      Signed-By: /usr/share/keyrings/microsoft-vscode.gpg
  when: ansible_facts['os_family'] == "Debian"

- name: Remove the legacy one-line vscode.list (superseded by vscode.sources)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vscode.list
    state: absent
  when: ansible_facts['os_family'] == "Debian"

- name: Install VS Code
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

# The SAME settings.json (colour theme "Dark Modern", editor prefs, ...) is the
# source of truth for both hosts — only the destination differs: native config
# dir on Mint, the flatpak's app dir on Bazzite (VS Code itself is installed by
# the flatpaks role there).
- name: Ensure the VS Code user config directory exists
  ansible.builtin.file:
    path: "/home/{{ primary_user }}/.config/Code/User"
    state: directory
    mode: "0755"
  become: false
  when: ansible_facts['os_family'] == "Debian"

- name: Deploy VS Code user settings
  ansible.builtin.copy:
    src: settings.json
    dest: "/home/{{ primary_user }}/.config/Code/User/settings.json"
    mode: "0644"
  become: false
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure the VS Code (flatpak) user config directory exists
  ansible.builtin.file:
    path: "/home/{{ primary_user }}/.var/app/com.visualstudio.code/config/Code/User"
    state: directory
    mode: "0755"
  become: false
  when: ansible_facts['os_family'] != "Debian"

- name: Deploy VS Code user settings (flatpak)
  ansible.builtin.copy:
    src: settings.json
    dest: "/home/{{ primary_user }}/.var/app/com.visualstudio.code/config/Code/User/settings.json"
    mode: "0644"
  become: false
  when: ansible_facts['os_family'] != "Debian"

# VS Code creates argv.json at its first start with the crash reporter on; the
# native and the flatpak VS Code both read it from ~/.vscode.
- name: Ensure ~/.vscode exists
  ansible.builtin.file:
    path: "/home/{{ primary_user }}/.vscode"
    state: directory
    mode: "0755"
  become: false

- name: Create VS Code's argv.json with the crash reporter off
  ansible.builtin.copy:
    dest: "/home/{{ primary_user }}/.vscode/argv.json"
    content: |
      {
        "enable-crash-reporter": false
      }
    mode: "0644"
    force: false
  become: false

- name: Turn off VS Code's crash reporter
  ansible.builtin.lineinfile:
    path: "/home/{{ primary_user }}/.vscode/argv.json"
    regexp: '^(\s*"enable-crash-reporter":\s*)true(.*)$'
    line: '\1false\2'
    backrefs: true
  become: false

# The Codex extension and the terminal's Codex share this file, which holds
# the user's own settings too.
- name: Turn off Codex's usage analytics
  community.general.ini_file:
    path: "/home/{{ primary_user }}/.codex/config.toml"
    section: analytics
    option: enabled
    value: "false"
    mode: "0600"
  become: false

# The extension list is additive (extras installed by hand are left alone) and
# the extensions self-update in-app on both hosts; only the `code` CLI wrapping
# differs. On Bazzite the flatpak's CLI is reached via `flatpak run --command`.
- name: List installed VS Code extensions
  ansible.builtin.command: code --list-extensions
  become: false
  changed_when: false
  register: vscode_installed
  when: ansible_facts['os_family'] == "Debian"

- name: Install VS Code extensions
  ansible.builtin.command: "code --install-extension {{ item }}"
  become: false
  loop: "{{ vscode_extensions | difference(vscode_extensions_absent) }}"
  when:
    - ansible_facts['os_family'] == "Debian"
    - item not in (vscode_installed.stdout_lines | default([]))
  changed_when: true

- name: Uninstall unwanted VS Code extensions
  ansible.builtin.command: "code --uninstall-extension {{ item }}"
  become: false
  loop: "{{ vscode_extensions_absent }}"
  when:
    - ansible_facts['os_family'] == "Debian"
    - item in (vscode_installed.stdout_lines | default([]))
  changed_when: true

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "/home/{{ primary_user }}/.local/bin"
    state: directory
    mode: "0755"
  become: false

- name: Run the extensions' Codex and Claude Code from the terminal
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/home/{{ primary_user }}/.local/bin/{{ item.name }}"
    mode: "0755"
  become: false
  loop:
    - { src: codex-terminal, name: codex }
    - { src: claude-terminal, name: claude }
  loop_control:
    label: "{{ item.name }}"

- name: Ensure the user unit directory exists
  ansible.builtin.file:
    path: "/home/{{ primary_user }}/.config/systemd/user"
    state: directory
    mode: "0755"
  become: false

- name: Update the unpinned extensions daily while VS Code stays closed
  when: vscode_update_extensions | bool
  block:
    - name: Install the extension update script
      ansible.builtin.copy:
        src: vscode-update-extensions
        dest: "/home/{{ primary_user }}/.local/bin/vscode-update-extensions"
        mode: "0755"
      become: false

    - name: Install the extension update units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/home/{{ primary_user }}/.config/systemd/user/{{ item }}"
        mode: "0644"
      become: false
      loop:
        - vscode-update-extensions.service
        - vscode-update-extensions.timer

    # A check run copies no unit file, so the timer it would enable is unknown.
    - name: Enable the extension update timer
      ansible.builtin.systemd_service:
        name: vscode-update-extensions.timer
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      become: false
      ignore_errors: "{{ ansible_check_mode }}"

- name: Run Claude Code under x86-64 emulation
  ansible.builtin.include_tasks: claude-x86emu.yml
  when:
    - ansible_facts['os_family'] == "Debian"
    - vscode_claude_x86emu | bool

- name: List installed VS Code extensions (flatpak)
  ansible.builtin.command: >-
    flatpak run --command=code com.visualstudio.code --list-extensions
  become: false
  changed_when: false
  register: vscode_flatpak_installed
  when: ansible_facts['os_family'] != "Debian"

- name: Install VS Code extensions (flatpak)
  ansible.builtin.command: >-
    flatpak run --command=code com.visualstudio.code --install-extension {{ item }}
  become: false
  loop: "{{ vscode_extensions | difference(vscode_extensions_absent) }}"
  when:
    - ansible_facts['os_family'] != "Debian"
    - item not in (vscode_flatpak_installed.stdout_lines | default([]))
  changed_when: true

- name: Uninstall unwanted VS Code extensions (flatpak)
  ansible.builtin.command: >-
    flatpak run --command=code com.visualstudio.code --uninstall-extension {{ item }}
  become: false
  loop: "{{ vscode_extensions_absent }}"
  when:
    - ansible_facts['os_family'] != "Debian"
    - item in (vscode_flatpak_installed.stdout_lines | default([]))
  changed_when: true

# Lets the user flash and monitor the boards pioarduino builds for: serial
# adapters and debug probes become user-accessible, and ModemManager leaves them alone.
- name: Install PlatformIO's udev rules for development boards
  ansible.builtin.copy:
    src: 99-platformio-udev.rules
    dest: /etc/udev/rules.d/99-platformio-udev.rules
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Apply udev rules
