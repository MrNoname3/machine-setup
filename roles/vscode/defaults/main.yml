---
# Extensions mirrored from the desktop's VS Code (installed idempotently).
vscode_extensions:
  - anthropic.claude-code
  - mhutchie.git-graph
  - ms-python.debugpy
  - ms-python.python
  - ms-python.vscode-pylance
  - ms-python.vscode-python-envs
  - ms-vscode-remote.remote-ssh
  - ms-vscode-remote.remote-ssh-edit
  - ms-vscode.cpptools
  - ms-vscode.remote-explorer
  - openai.chatgpt  # Codex; its extension pack adds openai.codex-audio
  - pioarduino.pioarduino-ide

# Extensions removed where present, and never installed even when listed above.
# PlatformIO IDE and its fork pioarduino cannot be installed side by side.
vscode_extensions_absent:
  - platformio.platformio-ide

# Run the Claude Code extension's native binary under qemu-user emulation, for
# a CPU without the instructions it is built for (tasks/claude-x86emu.yml).
vscode_claude_x86emu: false
