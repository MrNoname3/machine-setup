---
# Desktop defaults for Linux Mint with Xfce: the session's xfconf settings,
# kept in step with the Cinnamon ones in cinnamon.yml where Xfce has a
# counterpart.

# The session itself, not the edition's metapackage (see cinnamon.yml).
- name: Install the Xfce desktop
  ansible.builtin.apt:
    name:
      - xfce4-session
      - xfwm4
      - xfdesktop4
      - xfce4-panel
      - xfce4-settings
      - xfconf
      - thunar
      - xfce4-whiskermenu-plugin
      - xfce4-power-manager
      - xfce4-screensaver
      - xdg-desktop-portal-xapp
      - redshift                 # Night Light (no Xfce counterpart)
      - xcape                    # Super tap opens the menu (see below)
    state: present
  when: ansible_facts['os_family'] == "Debian"

# xfce4-screensaver locks the session; Mint's light-locker would lock it at
# the same time, through the login screen on another VT.
- name: Remove light-locker (Xfce)
  ansible.builtin.apt:
    name:
      - light-locker
      - light-locker-settings
    state: absent
    purge: true                  # its autostart entry is a conffile
  when: ansible_facts['os_family'] == "Debian"

# Mint ships these hidden already; they are set so a changed default does not
# bring them back.
- name: Hide the standard + removable-volume icons from the Xfce desktop
  community.general.xfconf:
    channel: xfce4-desktop
    property: "/desktop-icons/file-icons/{{ item }}"
    value_type: bool
    value: "false"
  become: false
  loop:
    - show-filesystem
    - show-home
    - show-trash
    - show-removable

# misc-directory-specific-settings keeps a view set by hand on its folder.
- name: Default Thunar to list view sorted by name ascending (manual per-folder overrides respected)
  community.general.xfconf:
    channel: thunar
    property: "{{ item.property }}"
    value_type: "{{ item.type }}"
    value: "{{ item.value }}"
  become: false
  loop:
    - { property: /default-view, type: string, value: ThunarDetailsView }
    - { property: /last-sort-column, type: string, value: THUNAR_COLUMN_NAME }
    - { property: /last-sort-order, type: string, value: GTK_SORT_ASCENDING }
    - { property: /misc-directory-specific-settings, type: bool, value: "true" }
  loop_control:
    label: "{{ item.property }}"

# As Dolphin on the desktop: the full path in the title bar, no menu bar.
- name: Show the full path in Thunar's title bar and hide its menu bar
  community.general.xfconf:
    channel: thunar
    property: "{{ item.property }}"
    value_type: bool
    value: "{{ item.value }}"
  become: false
  loop:
    - { property: /misc-full-path-in-window-title, value: "true" }
    - { property: /last-menubar-visible, value: "false" }
  loop_control:
    label: "{{ item.property }}"

# Thunar keeps a folder's own sort in the folder's GIO metadata.
- name: Read the Downloads folder's sort (Thunar)
  ansible.builtin.command:
    argv:
      - gio
      - info
      - --attributes=metadata::thunar-sort-column,metadata::thunar-sort-order
      - "/home/{{ primary_user }}/Downloads"
  register: thunar_downloads_sort
  changed_when: false
  failed_when: false
  check_mode: false
  become: false

- name: Sort the Downloads folder by date, newest first (Thunar)
  ansible.builtin.command:
    argv: [gio, set, "/home/{{ primary_user }}/Downloads", "metadata::{{ item.key }}", "{{ item.value }}"]
  become: false
  loop:
    - { key: thunar-sort-column, value: THUNAR_COLUMN_DATE_MODIFIED }
    - { key: thunar-sort-order, value: GTK_SORT_DESCENDING }
  when:
    - thunar_downloads_sort.rc == 0
    - "('metadata::' ~ item.key ~ ': ' ~ item.value) not in thunar_downloads_sort.stdout"
  changed_when: true

# xfwm4 does not follow the GTK theme on its own. The portal key is the one
# libadwaita apps read, as in the Cinnamon session.
- name: Apply the dark desktop theme + icon/cursor themes (Xfce)
  community.general.xfconf:
    channel: "{{ item.channel }}"
    property: "{{ item.property }}"
    value_type: string
    value: "{{ item.value }}"
  become: false
  loop:
    - { channel: xsettings, property: /Net/ThemeName, value: Mint-Y-Dark-Aqua }
    - { channel: xsettings, property: /Net/IconThemeName, value: Mint-Y-Sand }
    - { channel: xsettings, property: /Gtk/CursorThemeName, value: Yaru }
    - { channel: xfwm4, property: /general/theme, value: Mint-Y-Dark-Aqua }
  loop_control:
    label: "{{ item.channel }}{{ item.property }}"

- name: Prefer the dark colour scheme in portal-aware apps (Xfce)
  community.general.dconf:
    key: /org/x/apps/portal/color-scheme
    value: "'prefer-dark'"
    state: present
  become: false

- name: Set the Hungarian keyboard layout (Xfce)
  community.general.xfconf:
    channel: keyboard-layout
    property: "{{ item.property }}"
    value_type: "{{ item.type }}"
    value: "{{ item.value }}"
  become: false
  loop:
    - { property: /Default/XkbDisable, type: bool, value: "false" }
    - { property: /Default/XkbLayout, type: string, value: hu }
  loop_control:
    label: "{{ item.property }}"

# Super+arrows as in Cinnamon: tile to the left or right half, toggle
# maximized, minimize. Mint binds none of them.
- name: Bind Super+arrows to window tiling (Xfce)
  community.general.xfconf:
    channel: xfce4-keyboard-shortcuts
    property: "/xfwm4/custom/<Super>{{ item.key }}"
    value_type: string
    value: "{{ item.action }}"
  become: false
  loop:
    - { key: Left, action: tile_left_key }
    - { key: Right, action: tile_right_key }
    - { key: Up, action: maximize_window_key }
    - { key: Down, action: hide_window_key }
  loop_control:
    label: "<Super>{{ item.key }}"

# xfwm4 keeps one key per action, whichever it reads last, so the other keys
# Mint gives these actions are removed.
- name: Drop Mint's other keys for the Super+arrow actions (Xfce)
  community.general.xfconf:
    channel: xfce4-keyboard-shortcuts
    property: "/xfwm4/custom/{{ item }}"
    state: absent
  become: false
  loop:
    - <Super>KP_Left
    - <Super>KP_Right
    - <Alt>F10
    - <Alt>F9

# xfsettingsd runs a lone-Super shortcut on key press, so the menu takes the
# focus before Super+arrow arrives. xcape sends Ctrl+Esc for a Super tap only.
- name: Drop the menu's Super press shortcut (Xfce)
  community.general.xfconf:
    channel: xfce4-keyboard-shortcuts
    property: /commands/custom/Super_L
    state: absent
  become: false

- name: Open the menu on Ctrl+Esc (Xfce)
  community.general.xfconf:
    channel: xfce4-keyboard-shortcuts
    property: /commands/custom/<Primary>Escape
    value_type: string
    value: xfce4-popup-whiskermenu
  become: false

# Windows bigger than placement_ratio % of the screen are placed top-left
# ("smart" placement) instead of by placement_mode.
- name: Open every window centred (Xfce)
  community.general.xfconf:
    channel: xfwm4
    property: "{{ item.property }}"
    value_type: "{{ item.type }}"
    value: "{{ item.value }}"
  become: false
  loop:
    - { property: /general/placement_mode, type: string, value: center }
    - { property: /general/placement_ratio, type: int, value: "100" }
  loop_control:
    label: "{{ item.property }}"

- name: Turn xfwm4's compositor on or off (Xfce)
  community.general.xfconf:
    channel: xfwm4
    property: /general/use_compositing
    value_type: bool
    value: "{{ base_xfce_compositing | bool | lower }}"
  become: false

# Without a restored state of its own, the session keeps the NumLock the
# login screen switched on.
- name: Keep the login screen's NumLock in the session (Xfce)
  community.general.xfconf:
    channel: keyboards
    property: /Default/RestoreNumlock
    value_type: bool
    value: "false"
  become: false

# The screensaver starts after 10 min and locks the screen 5 min later, when
# the display powers off; the machine suspends after 20 min.
- name: Start the screensaver after 10 min and lock 5 min later (Xfce)
  community.general.xfconf:
    channel: xfce4-screensaver
    property: "{{ item.property }}"
    value_type: "{{ item.type }}"
    value: "{{ item.value }}"
  become: false
  loop:
    - { property: /saver/mode, type: int, value: "2" }    # the one theme below
    - { property: /saver/idle-activation/enabled, type: bool, value: "true" }
    - { property: /saver/idle-activation/delay, type: int, value: "10" }
    - { property: /lock/enabled, type: bool, value: "true" }
    - { property: /lock/saver-activation/enabled, type: bool, value: "true" }
    - { property: /lock/saver-activation/delay, type: int, value: "5" }
  loop_control:
    label: "{{ item.property }}"

- name: Use the Floaters screensaver (Xfce)
  community.general.xfconf:
    channel: xfce4-screensaver
    property: /saver/themes/list
    value_type: string
    value: [screensavers-xfce-floaters]
    force_array: true
  become: false

- name: Configure power management — display off, auto-suspend, buttons (Xfce)
  community.general.xfconf:
    channel: xfce4-power-manager
    property: "/xfce4-power-manager/{{ item.property }}"
    value_type: "{{ item.type }}"
    value: "{{ item.value }}"
  become: false
  loop:
    - { property: dpms-enabled, type: bool, value: "true" }
    - { property: dpms-on-ac-sleep, type: uint, value: "15" }
    - { property: dpms-on-ac-off, type: uint, value: "15" }
    - { property: inactivity-on-ac, type: uint, value: "20" }
    - { property: inactivity-sleep-mode-on-ac, type: uint, value: "1" }   # suspend
    - { property: power-button-action, type: uint, value: "4" }           # shut down
    - { property: sleep-button-action, type: uint, value: "1" }           # suspend
    - { property: general-notification, type: bool, value: "false" }
  loop_control:
    label: "{{ item.property }}"

- name: Show notifications at the bottom right (Xfce)
  community.general.xfconf:
    channel: xfce4-notifyd
    property: /notify-location
    value_type: string
    value: bottom-right
  become: false

# Night Light as in the Cinnamon session: a fixed 5600 K. With equal day and
# night temperatures the location given to redshift has no effect.
- name: Ensure ~/.config/autostart exists
  ansible.builtin.file:
    path: "/home/{{ primary_user }}/.config/autostart"
    state: directory
    mode: "0755"
  become: false

- name: Autostart an always-on Night Light (redshift)
  ansible.builtin.copy:
    dest: "/home/{{ primary_user }}/.config/autostart/redshift-night-light.desktop"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Night Light
      Exec=redshift -P -r -l 0:0 -t 5600:5600
      NoDisplay=true
      X-GNOME-Autostart-enabled=true
  become: false

- name: Autostart xcape (a Super tap sends Ctrl+Esc)
  ansible.builtin.copy:
    dest: "/home/{{ primary_user }}/.config/autostart/xcape-super-menu.desktop"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Super key menu
      Exec=xcape -e "Super_L=Control_L|Escape"
      NoDisplay=true
      X-GNOME-Autostart-enabled=true
  become: false
