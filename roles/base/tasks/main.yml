---
# Base role: package management and common configuration.
# apt tasks are guarded so this role is safe to include on non-Debian hosts
# (e.g. the immutable Bazzite desktop, which uses rpm-ostree instead). The Mint
# desktop defaults are in mint.yml plus <base_desktop>.yml, for hosts that set
# base_desktop.

- name: Passwordless sudo for the primary user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ primary_user }}-nopasswd"
    content: "{{ primary_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

# Only ever pull hard dependencies -- never Recommends/Suggests -- so installs
# stay minimal and no surprise packages tag along (this is what pulled docker.io
# in as a docker-compose-v2 Recommends). Set BEFORE the package tasks so it takes
# effect on the same run. Affects future installs only; existing packages and the
# recommends they already have are left untouched.
- name: Configure APT to skip Recommends and Suggests
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-no-recommends
    content: |
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
    mode: "0644"
  when: ansible_facts['os_family'] == "Debian"

- name: Install packages (apt)
  ansible.builtin.apt:
    name: "{{ packages_present }}"
    state: present
    update_cache: true
  when:
    - ansible_facts['os_family'] == "Debian"
    - packages_present | length > 0

# Removing ecryptfs-utils takes its PAM module away, which an
# ecryptfs-encrypted home needs to log in.
- name: Find ecryptfs-encrypted homes
  ansible.builtin.find:
    paths: /home
    patterns: .ecryptfs
    file_type: any
    hidden: true
    recurse: true
    depth: 2
  register: base_ecryptfs_homes
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'ecryptfs-utils' in packages_absent"

- name: Keep ecryptfs while a home uses it
  ansible.builtin.assert:
    that: base_ecryptfs_homes.matched == 0
    fail_msg: >-
      {{ base_ecryptfs_homes.files | map(attribute='path') | join(', ') }} is in
      use, so ecryptfs-utils must stay: take it out of packages_absent.
    quiet: true
  when: base_ecryptfs_homes is not skipped

- name: Remove packages (apt)
  ansible.builtin.apt:
    name: "{{ packages_absent }}"
    state: absent
    purge: true
    autoremove: true
  when:
    - ansible_facts['os_family'] == "Debian"
    - packages_absent | length > 0

- name: Set the default applications (user MIME associations)
  community.general.ini_file:
    path: "/home/{{ primary_user }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: "{{ user_config_mode }}"
    no_extra_spaces: true
  become: false
  loop: "{{ base_mime_defaults | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# UPower 1.90.9 (Debian 13) reads no drop-in directory, so the settings go
# into its own configuration file.
- name: Set the UPower battery policy
  community.general.ini_file:
    path: /etc/UPower/UPower.conf
    section: UPower
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: "0644"
    no_extra_spaces: true
    # The file lists the defaults as commented-out options, which stay comments.
    modify_inactive_option: false
  loop: "{{ base_upower_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart upower

- name: Set the locale categories in /etc/default/locale
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^{{ item.key }}="
    line: '{{ item.key }}="{{ item.value }}"'
  loop: "{{ base_locale | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Ensure ~/.config/autostart exists (hidden autostart entries)
  ansible.builtin.file:
    path: "/home/{{ primary_user }}/.config/autostart"
    state: directory
    mode: "0755"
  become: false
  when: base_autostart_hidden | length > 0

# An entry of the same name in the user's autostart directory overrides the
# system one.
- name: Skip autostart entries in the user's session
  ansible.builtin.copy:
    dest: "/home/{{ primary_user }}/.config/autostart/{{ item }}.desktop"
    content: |
      [Desktop Entry]
      Type=Application
      Name={{ item }}
      Hidden=true
    mode: "0644"
  become: false
  loop: "{{ base_autostart_hidden }}"

- name: Stop and disable systemd units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ base_units_disabled }}"
  register: base_units_stopped

# A unit whose stop command fails (podman-restart's, with nothing to stop)
# would otherwise stay listed as failed.
- name: Clear the failed state of the units just stopped
  ansible.builtin.command: systemctl reset-failed {{ item.item }}
  loop: "{{ base_units_stopped.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: false
  failed_when: false

# bluetoothd's SAP plugin offers the machine's SIM card to other Bluetooth
# devices; with no SIM driver it fails at every start and logs the failure.
# The drop-in keeps the packaged command line and adds -P sap; it takes effect
# at the next start of bluetoothd, so connected devices are not dropped.
- name: Read bluetoothd's command line
  ansible.builtin.command: grep -m1 "^ExecStart=" /usr/lib/systemd/system/bluetooth.service
  register: base_bluetoothd_exec
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == "Debian"

- name: Leave out bluetoothd's SIM Access plugin
  when:
    - ansible_facts['os_family'] == "Debian"
    - base_bluetoothd_exec.rc == 0
  block:
    - name: Ensure the bluetooth unit's drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/bluetooth.service.d
        state: directory
        mode: "0755"

    - name: Start bluetoothd without the SAP plugin
      ansible.builtin.copy:
        dest: /etc/systemd/system/bluetooth.service.d/no-sap.conf
        content: |
          [Service]
          ExecStart=
          {{ base_bluetoothd_exec.stdout }} -P sap
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

- name: Linux Mint desktop defaults
  ansible.builtin.include_tasks: mint.yml
  when: base_desktop | length > 0

- name: Desktop session defaults ({{ base_desktop }})
  ansible.builtin.include_tasks: "{{ base_desktop }}.yml"
  when: base_desktop | length > 0
