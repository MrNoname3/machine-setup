---
# Packages to install and to remove (apt); set per host.
packages_present: []
packages_absent: []

# The Linux Mint desktop whose defaults to apply: cinnamon (tasks/mint.yml,
# then tasks/<base_desktop>.yml). Empty applies none.
base_desktop: ""

# The session the login screen picks for a user who has not chosen one, such
# as cinnamon-wayland; empty keeps the edition's default (mint-info-*).
base_session: ""

# Applications pinned to the Cinnamon panel's window list, left to right, as
# desktop file names; a Flatpak app as "<app-id>.desktop:flatpak". Empty
# leaves the panel alone.
base_panel_launchers: []

# Nemo's sidebar bookmarks as GTK bookmark lines ("<file URI> <label>"); empty
# leaves the bookmarks alone.
base_gtk_bookmarks: []

# The panel clock's format (GLib date format, %n for a second line); empty
# keeps Cinnamon's default.
base_panel_clock_format: ""

# Default applications per MIME type ({type: desktop entry}), written to the
# user's mimeapps.list; set per host.
base_mime_defaults: {}

# UPower settings ({option: value}) written to /etc/UPower/UPower.conf, such
# as the battery levels of the warnings and of the critical action; set per
# host.
base_upower_settings: {}

# Locale categories ({variable: locale}) written to /etc/default/locale, such
# as LC_TIME; they take effect at the next login. Set per host.
base_locale: {}

# XDG autostart entries (desktop file names without .desktop) the user's
# session skips; set per host.
base_autostart_hidden: []

# systemd units stopped and disabled; set per host.
base_units_disabled: []

# The user's input method framework in im-config's terms (ibus, fcitx5, none);
# empty keeps what the user has. It applies from the next login.
base_input_method: ""

# Default video player (XDG MIME associations in the user's mimeapps.list).
default_video_player: vlc.desktop
video_mimetypes:
  - video/mp4
  - video/x-matroska
  - video/x-msvideo
  - video/quicktime
  - video/webm
  - video/mpeg
  - video/x-ms-wmv
  - video/x-flv
  - video/3gpp
  - video/3gpp2
  - video/x-m4v
  - video/ogg
  - video/mp2t
  - video/x-ms-asf
  - video/dv
  - video/x-ogm+ogg
  - video/x-theora+ogg

# Default audio player (XDG MIME associations), or "" to leave audio files alone.
default_audio_player: ""
audio_mimetypes:
  - audio/mpeg
  - audio/flac
  - audio/x-flac
  - audio/ogg
  - audio/x-vorbis+ogg
  - audio/opus
  - audio/x-opus+ogg
  - audio/x-wav
  - audio/mp4
  - audio/aac
  - audio/x-m4a
  - audio/x-ms-wma
  - audio/x-matroska
  - audio/webm

# Celluloid's mpv-options setting (for example the GPU's hardware decoding),
# or "" to leave it alone.
celluloid_mpv_options: ""

# Celluloid with VLC's keys for speed (+ - =) and subtitle delay (g h), which
# also work on layouts where mpv's own [ ] z keys need AltGr.
celluloid_vlc_keys: false

# Default text editor (Kate) for text/source MIME types.
default_text_editor: org.kde.kate.desktop
text_mimetypes:
  - text/plain
  - application/x-zerosize          # empty files (xed handled these too)
  - text/markdown
  - text/x-python
  - text/x-python3
  - application/json
  - text/xml
  - application/xml
  - text/x-shellscript
  - application/x-shellscript
  - text/x-csrc
  - text/x-c++src
  - text/x-chdr
  - text/css
  - text/x-log
  - text/csv
  - application/yaml
  - application/x-yaml
  - text/x-java
