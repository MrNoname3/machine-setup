---
# Packages to install and to remove (apt); set per host.
packages_present: []
packages_absent: []

# Apply the Linux Mint / Cinnamon desktop defaults (tasks/cinnamon.yml).
base_cinnamon: false

# Default applications per MIME type ({type: desktop entry}), written to the
# user's mimeapps.list; set per host.
base_mime_defaults: {}

# UPower settings ({option: value}) written to /etc/UPower/UPower.conf, such
# as the battery levels of the warnings and of the critical action; set per
# host.
base_upower_settings: {}

# Default video player (XDG MIME associations in the user's mimeapps.list).
default_video_player: vlc.desktop
video_mimetypes:
  - video/mp4
  - video/x-matroska
  - video/x-msvideo
  - video/quicktime
  - video/webm
  - video/mpeg
  - video/x-ms-wmv
  - video/x-flv
  - video/3gpp
  - video/3gpp2
  - video/x-m4v
  - video/ogg
  - video/mp2t
  - video/x-ms-asf
  - video/dv
  - video/x-ogm+ogg
  - video/x-theora+ogg

# Default text editor (Kate) for text/source MIME types.
default_text_editor: org.kde.kate.desktop
text_mimetypes:
  - text/plain
  - application/x-zerosize          # empty files (xed handled these too)
  - text/markdown
  - text/x-python
  - text/x-python3
  - application/json
  - text/xml
  - application/xml
  - text/x-shellscript
  - application/x-shellscript
  - text/x-csrc
  - text/x-c++src
  - text/x-chdr
  - text/css
  - text/x-log
  - text/csv
  - application/yaml
  - application/x-yaml
  - text/x-java
