---
# Encrypted data disks: LUKS2, auto-unlocked at boot with a root-only keyfile,
# a passphrase slot as the manual fallback. The DESTRUCTIVE initial setup
# (partition + luksFormat + mkfs) is a one-time manual bootstrap -- see
# roles/storage/README.md. This role only wires up the persistent config
# (keyfile permissions, crypttab, mountpoint, fstab).
#
# A host lists its disks in storage_disks (host_vars). Each item:
#   name        crypttab / device-mapper name (/dev/mapper/<name>)
#   device      the LUKS partition, found by its GPT label: "PARTLABEL=<name>-crypt"
#   mountpoint  where the opened filesystem is mounted
#   fstype      filesystem inside the LUKS container
#   opts        fstab mount options
#   keyfile     optional; default /etc/cryptsetup-keys.d/<name>.key, the place
#               systemd-cryptsetup looks first, inside the root filesystem
#   owner       optional; owner of the mountpoint directory (primary_user)
#   selinux_type  optional; SELinux type of the disk's files (storage_selinux_type)
storage_disks: []

# SELinux type of the disks' files where SELinux is enabled: a new filesystem
# carries no labels, and unlabeled files are out of reach of confined services.
storage_selinux_type: user_home_t

# crypttab options of every disk. nofail: boot goes on without a missing disk.
storage_crypttab_opts: luks,nofail
