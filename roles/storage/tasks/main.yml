---
# storage role: auto-unlock + automount for the encrypted data disks.
#
# This role does NOT partition or format a disk -- that is destructive and is
# a one-time MANUAL bootstrap (see roles/storage/README.md). Here we only ensure
# the persistent, idempotent config: the keyfile permissions, the crypttab
# auto-unlock entry, the mountpoint, and the fstab automount line.
#
# The keyfiles are machine-local secrets and are NEVER stored in this repo; only
# their paths are. Everything here needs root, so a run without it (the
# desktop's day-to-day `-e ansible_become=false`) skips the role with a notice.

- name: Check whether this run has root
  ansible.builtin.command: id -u
  register: storage_uid
  changed_when: false
  check_mode: false

- name: Note that the data disks were skipped (no root)
  ansible.builtin.debug:
    msg: >-
      The storage role needs root, so it was skipped. Run it with:
      ./scripts/apply.sh {{ inventory_hostname }} --tags storage -K
  when: storage_uid.stdout != "0"

- name: Wire up the encrypted data disks
  when: storage_uid.stdout == "0"
  vars:
    disks: "{{ storage_disks | default(storage_legacy_disks) }}"
  block:
    - name: Ensure the keyfile directories exist
      ansible.builtin.file:
        path: "{{ (item.keyfile | default('/etc/cryptsetup-keys.d/' ~ item.name ~ '.key')) | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop: "{{ disks }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Check whether each keyfile is present
      ansible.builtin.stat:
        path: "{{ item.keyfile | default('/etc/cryptsetup-keys.d/' ~ item.name ~ '.key') }}"
      register: storage_keyfiles
      loop: "{{ disks }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fail early if a keyfile is missing (run the manual disk bootstrap first)
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: >-
          The keyfile of {{ item.item.name }} is missing. Run the one-time disk
          bootstrap in roles/storage/README.md, or restore the keyfile with the
          fallback passphrase (see Recovery there).
        quiet: true
      loop: "{{ storage_keyfiles.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Lock down the keyfile permissions (root read-only)
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        owner: root
        group: root
        mode: "0400"
      loop: "{{ storage_keyfiles.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Configure crypttab auto-unlock for each disk
      community.general.crypttab:
        name: "{{ item.name }}"
        backing_device: "{{ item.device }}"
        password: "{{ item.keyfile | default('/etc/cryptsetup-keys.d/' ~ item.name ~ '.key') }}"
        opts: "{{ storage_crypttab_opts }}"
        state: present
      notify: Reload systemd
      loop: "{{ disks }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure the mountpoints exist
      ansible.builtin.file:
        path: "{{ item.mountpoint }}"
        state: directory
        owner: "{{ item.owner | default(primary_user) }}"
        group: "{{ item.owner | default(primary_user) }}"
        mode: "0755"
      loop: "{{ disks }}"
      loop_control:
        label: "{{ item.mountpoint }}"

    - name: Automount each disk via fstab
      ansible.posix.mount:
        path: "{{ item.mountpoint }}"
        src: "/dev/mapper/{{ item.name }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ item.opts }}"
        state: mounted
      notify: Reload systemd
      loop: "{{ disks }}"
      loop_control:
        label: "{{ item.mountpoint }}"
