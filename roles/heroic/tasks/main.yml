---
# Heroic keeps its default settings in two files, config.json and its store's
# copy, so the defaults are set in both. Only these keys are edited; a file
# Heroic has not created yet is left alone.

- name: Check whether Heroic is running
  ansible.builtin.command: flatpak ps --columns=application
  register: heroic_running
  changed_when: false
  become: false

- name: Set Heroic's defaults (Wine, and where games and prefixes go)
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, os, sys
        path, section, desired = sys.argv[1], sys.argv[2], json.loads(sys.argv[3])
        if not os.path.exists(path):
            print('OK'); sys.exit(0)
        with open(path) as f:
            config = json.load(f)
        settings = config.setdefault(section, {})
        if all(settings.get(k) == v for k, v in desired.items()):
            print('OK'); sys.exit(0)
        settings.update(desired)
        with open(path, 'w') as f:
            json.dump(config, f, indent=2, ensure_ascii=False)
        print('CHANGED')
      - "{{ heroic_config_dir }}/{{ item.file }}"
      - "{{ item.section }}"
      - "{{ heroic_defaults | to_json }}"
  vars:
    heroic_defaults: >-
      {{ {'wineVersion': {'bin': heroic_steam_compat_dir ~ '/' ~ heroic_default_proton ~ '/proton',
                          'name': heroic_default_proton, 'type': 'proton'}}
         | combine({} if heroic_install_path | length == 0 else
                   {'defaultInstallPath': heroic_install_path,
                    'defaultWinePrefix': heroic_install_path ~ '/Prefixes/default'}) }}
  register: heroic_wine_result
  changed_when: "'CHANGED' in heroic_wine_result.stdout"
  become: false
  when: "'com.heroicgameslauncher.hgl' not in heroic_running.stdout_lines"
  loop:
    - { file: config.json, section: defaultSettings }
    - { file: store/config.json, section: settings }
  loop_control:
    label: "{{ item.file }}"

- name: Warn that the default Wine was skipped because Heroic is running
  ansible.builtin.debug:
    msg: Heroic is running, so its default Wine was not set. Close it and re-run.
  when: "'com.heroicgameslauncher.hgl' in heroic_running.stdout_lines"
