---
# Homebrew CLI packages (Bazzite: brew ships with the image and is the way to
# get CLI tools without rpm-ostree layering). Per-host list; empty = no-op.
brew_packages: []
brew_prefix: /home/linuxbrew/.linuxbrew

# Homebrew's analytics: it reports every install to its own InfluxDB unless
# turned off.
brew_analytics: false
