---
# brew role: ensure the host's Homebrew package set. Bazzite ships Homebrew in
# the image; this only manages the requested leaves (dependencies follow).

- name: Install Homebrew packages
  community.general.homebrew:
    name: "{{ brew_packages }}"
    path: "{{ brew_prefix }}/bin"
    state: present
  become: false # brew refuses to run as root by design
  when:
    - ansible_facts['os_family'] != "Debian"
    - brew_packages | length > 0

- name: Read Homebrew's analytics state
  ansible.builtin.command: "{{ brew_prefix }}/bin/brew analytics state"
  register: brew_analytics_state
  changed_when: false
  check_mode: false
  become: false
  when: ansible_facts['os_family'] != "Debian"

- name: Turn Homebrew's analytics {{ 'on' if brew_analytics | bool else 'off' }}
  ansible.builtin.command: "{{ brew_prefix }}/bin/brew analytics {{ 'on' if brew_analytics | bool else 'off' }}"
  become: false
  changed_when: true
  when:
    - ansible_facts['os_family'] != "Debian"
    - (brew_analytics_state.stdout is search('analytics are enabled')) != (brew_analytics | bool)
