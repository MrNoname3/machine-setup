---
# system-updates role (Linux Mint): Update Manager's automatic upgrades and
# removals, with a Timeshift snapshot of the system before every upgrade that
# has something to install, and a daily one. A failed snapshot stops the
# upgrade, and a failed snapshot or upgrade becomes a desktop notification
# through the disk-health role's notifier. It needs root, so a run without it
# skips the role with a notice.

- name: Check whether this run has root
  ansible.builtin.command: id -u
  register: system_updates_uid
  changed_when: false
  check_mode: false

- name: Note that automatic upgrades were skipped (no root)
  ansible.builtin.debug:
    msg: >-
      The system-updates role needs root, so it was skipped. Run it with:
      ./scripts/apply.sh {{ inventory_hostname }} --tags system-updates -K
  when: system_updates_uid.stdout != "0"

- name: Set up automatic upgrades with snapshots
  when: system_updates_uid.stdout == "0"
  block:
    - name: Require the disk-health role, whose notifier reports a failure
      ansible.builtin.assert:
        that: "'disk-health' in (roles_enabled | default([]))"
        fail_msg: The system-updates role needs disk-health in roles_enabled.
        quiet: true

    - name: Install Timeshift
      ansible.builtin.apt:
        name: timeshift
        state: present

    # Timeshift keeps its snapshots on the device that holds this filesystem.
    - name: Read the root filesystem's UUID
      ansible.builtin.command: findmnt -n -o UUID /
      register: system_updates_root_uuid
      changed_when: false
      check_mode: false

    - name: Read Timeshift's configuration
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: system_updates_timeshift_conf
      with_first_found:
        - /etc/timeshift/timeshift.json
        - /etc/timeshift/default.json

    # Timeshift rewrites its file itself (snapshot counts, its own layout, an
    # exclude per home), so only the settings below are compared and merged in,
    # and the excludes are added to its own. Its values are strings.
    - name: Configure Timeshift's daily snapshots
      vars:
        system_updates_timeshift_current: >-
          {{ system_updates_timeshift_conf.results[0].content | b64decode | from_json }}
        system_updates_timeshift_wanted:
          backup_device_uuid: "{{ system_updates_root_uuid.stdout }}"
          do_first_run: "false"
          btrfs_mode: "false"
          schedule_monthly: "false"
          schedule_weekly: "false"
          schedule_daily: "true"
          schedule_hourly: "false"
          schedule_boot: "false"
          count_daily: "{{ system_updates_daily_snapshots | string }}"
          exclude: >-
            {{ (system_updates_timeshift_current.exclude | default([]))
               + (system_updates_snapshot_exclude | difference(system_updates_timeshift_current.exclude | default([]))) }}
      ansible.builtin.copy:
        dest: /etc/timeshift/timeshift.json
        content: "{{ system_updates_timeshift_current | combine(system_updates_timeshift_wanted) | to_nice_json(indent=2) }}\n"
        owner: root
        group: root
        mode: "0644"
      when: >-
        system_updates_timeshift_wanted
        != (system_updates_timeshift_current | dict2items
            | selectattr('key', 'in', system_updates_timeshift_wanted.keys()) | items2dict)
      register: system_updates_timeshift_config

    # Timeshift writes its hourly check (/etc/cron.d/timeshift-hourly) itself
    # when it reads a schedule; the check takes a snapshot only when one is due,
    # so days the machine was off are made up at the next start.
    - name: Check for Timeshift's scheduler entry
      ansible.builtin.stat:
        path: /etc/cron.d/timeshift-hourly
      register: system_updates_timeshift_cron

    # timeshift --list exits with 1 while there is no snapshot yet.
    - name: Let Timeshift write its scheduler entry
      ansible.builtin.command: timeshift --list --scripted
      when: system_updates_timeshift_config is changed or not system_updates_timeshift_cron.stat.exists
      register: system_updates_timeshift_list
      changed_when: true
      failed_when: system_updates_timeshift_list.rc not in [0, 1]

    - name: Check that Timeshift wrote its scheduler entry
      ansible.builtin.stat:
        path: /etc/cron.d/timeshift-hourly
      register: system_updates_timeshift_cron_now
      failed_when: not system_updates_timeshift_cron_now.stat.exists

    # mintupdate-cli --yes would otherwise take the package's version of every
    # configuration file changed here.
    - name: Keep local configuration files on automatic upgrades
      ansible.builtin.copy:
        dest: /etc/mintupdate-automatic-upgrades.conf
        content: |
          # Options for mintupdate-cli on automatic upgrades, one per line.
          --keep-configuration
        owner: root
        group: root
        mode: "0644"

    - name: Ensure the script directory exists
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        mode: "0755"

    - name: Install the scripts run around the upgrade
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /usr/local/libexec/{{ item }}
        owner: root
        group: root
        mode: "0755"
      loop:
        - system-updates-snapshot
        - system-updates-check
        - system-updates-kernels

    - name: Install the failure report unit
      ansible.builtin.copy:
        src: system-updates-failed@.service
        dest: /etc/systemd/system/system-updates-failed@.service
        owner: root
        group: root
        mode: "0644"
      register: system_updates_failed_unit

    - name: Ensure the upgrade unit's drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/mintupdate-automation-upgrade.service.d
        state: directory
        mode: "0755"

    - name: Take a snapshot before every automatic upgrade, check and clean up after it
      ansible.builtin.copy:
        dest: /etc/systemd/system/mintupdate-automation-upgrade.service.d/system-updates.conf
        content: |
          [Unit]
          OnFailure=system-updates-failed@%n.service
          # Mint's script checks only a supply named AC; a laptop's may be ACAD.
          ConditionACPower=true

          [Service]
          ExecStartPre=/usr/local/libexec/system-updates-snapshot {{ system_updates_upgrade_snapshots }}
          ExecStartPost=/usr/local/libexec/system-updates-check
          ExecStartPost=/usr/local/libexec/system-updates-kernels
          # apt-get keeps every package it downloads; a rollback restores the snapshot instead.
          ExecStartPost=/usr/bin/apt-get clean
        owner: root
        group: root
        mode: "0644"
      register: system_updates_dropin

    - name: Reload systemd after a unit change
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: system_updates_failed_unit is changed or system_updates_dropin is changed

    # Update Manager's own switch (Preferences > Automation): a flag file plus
    # the timer, so its window shows the same state.
    - name: Check Update Manager's automation flags
      ansible.builtin.stat:
        path: /var/lib/linuxmint/mintupdate-automatic-{{ item.flag }}-enabled
      loop:
        - { automation: upgrade, flag: upgrades }
        - { automation: autoremove, flag: removals }
      loop_control:
        label: "{{ item.automation }}"
      register: system_updates_flags

    - name: Turn on automatic upgrades and removals
      ansible.builtin.command: mintupdate-automation {{ item.item.automation }} enable
      loop: "{{ system_updates_flags.results }}"
      loop_control:
        label: "{{ item.item.automation }}"
      when: not item.stat.exists
      changed_when: true

    # Update Manager's automation upgrades packages only; its window updates
    # Flatpaks and Cinnamon spices when it runs, and its autostart is off on
    # these hosts (base_autostart_hidden). Timers do those two instead.
    - name: Install the units that update Flatpaks and Cinnamon spices
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dir }}/{{ item.src }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { src: system-updates-flatpak.service, dir: /etc/systemd/system }
        - { src: system-updates-flatpak.timer, dir: /etc/systemd/system }
        - { src: system-updates-user.service, dir: /etc/systemd/user }
        - { src: system-updates-user.timer, dir: /etc/systemd/user }
      loop_control:
        label: "{{ item.src }}"

    - name: Enable the daily Flatpak update
      ansible.builtin.systemd_service:
        name: system-updates-flatpak.timer
        daemon_reload: true
        enabled: true
        state: started

    # systemctl --global enable, for every user's session manager from its
    # next start; the systemd module reports a change on every run there.
    - name: Enable the daily update of the user's Flatpaks and spices
      ansible.builtin.file:
        src: /etc/systemd/user/system-updates-user.timer
        dest: /etc/systemd/user/timers.target.wants/system-updates-user.timer
        state: link
