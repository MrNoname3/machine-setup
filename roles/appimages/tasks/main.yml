---
# appimages role: record the AppImage set Gear Lever manages, and — the part
# that actually needs managing — each app's *update source*.
#
# Gear Lever stores an app's update config in gearlever.conf, in a section keyed
# by the md5 of the AppImage's absolute path:
#
#   [app.<md5 of file_path>.update_manager]
#   manager = StaticFileUpdater | GithubUpdater | ...
#   <manager-specific keys>       # url= / repo=+repo_filename=+allow_prereleases=
#
# Writing those keys is equivalent to
#   flatpak run it.mijorus.gearlever --set-update-source <file> --manager <m> k=v
# except that this is idempotent per key, while the CLI always rewrites the
# section (and so always reports a change). Without a `manager` key Gear Lever
# falls back to the AppImage's embedded update info, and reports
# "UpdatesNotAvailable" when there is none — see the README for how a Gear Lever
# migration bug silently emptied these sections.
#
# All user-level (become: false): Gear Lever is a per-user flatpak and the
# AppImages live in the user's home.

- name: Ensure the AppImages directory exists
  ansible.builtin.file:
    path: "{{ appimages_dir }}"
    state: directory
    mode: "0755"
  become: false
  when: appimages | length > 0

# Created here rather than left to Gear Lever's first launch, so a fresh machine
# can be configured before the app has ever been opened.
- name: Ensure Gear Lever's config directory exists
  ansible.builtin.file:
    path: "{{ gearlever_config | dirname }}"
    state: directory
    mode: "0755"
  become: false
  when: appimages | length > 0

- name: Mirror the background update check into Gear Lever's config
  community.general.ini_file:
    path: "{{ gearlever_config }}"
    section: DEFAULT
    option: fetch-updates-in-background
    value: "{{ 'yes' if gearlever_fetch_updates_in_background else 'no' }}"
    mode: "0644"
  become: false
  when: appimages | length > 0

# One flat (section, option, value) list for the single ini_file loop below:
# every app contributes its `manager` key plus its manager-specific config keys.
- name: Flatten the per-app update sources into INI triples
  ansible.builtin.set_fact:
    gearlever_update_entries: >-
      {{ (gearlever_update_entries | default([]))
         + ((([{'option': 'manager', 'value': item.manager}])
             + (item.config | dict2items(key_name='option', value_name='value')))
            | map('combine', {'section': 'app.'
                              ~ ((appimages_dir ~ '/' ~ item.file) | hash('md5'))
                              ~ '.update_manager'})
            | list) }}
  loop: "{{ appimages }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure each AppImage's update source
  community.general.ini_file:
    path: "{{ gearlever_config }}"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  become: false
  loop: "{{ gearlever_update_entries | default([]) }}"
  loop_control:
    label: "{{ item.section }} -> {{ item.option }}"

# --- Desktop-entry repairs ------------------------------------------------
# Gear Lever regenerates an app's desktop entry from the AppImage's own internal
# entry on every update, and copies whatever it finds — including nothing. When an
# upstream build ships a stripped entry (no Icon/Comment/Categories) and carries
# no icon file, the app ends up with the generic 'applications-other' icon and
# loses its menu category. Saleae Logic 2.4.45 does exactly that. The `desktop:`
# mapping in host_vars puts those keys back after every update.
#
# Icons are referenced by NAME, never by path: Gear Lever's uninstall step (which
# also runs as the second half of an update) deletes the icon file outright if the
# entry's Icon is a path, so a path-referenced icon would not survive one update.
# Installed into the user's hicolor theme, where the name resolves and Gear Lever
# cannot reach it.
- name: Install AppImage icons into the user icon theme
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/home/{{ primary_user }}/.local/share/icons/hicolor/256x256/apps/{{ item | basename }}"
    mode: "0644"
  become: false
  with_fileglob: icons/*.png

# The repair is deliberately self-limiting. A stripped upstream desktop entry is
# almost certainly a packaging accident that gets fixed in a later release, and an
# unconditional override would then keep forcing this repo's copy of the icon over
# the vendor's current one — silently, forever.
#
# The test is whether the entry's Icon is an absolute PATH. Gear Lever writes a
# path whenever it successfully extracted an icon from the AppImage, and the
# generic 'applications-other' (or this role's own name-referenced icon) otherwise.
# So a path means upstream ships an icon again: the guard goes false, the role
# stops touching the entry, and it says so. Testing for 'applications-other'
# instead would misfire on the second run, once our own repair is in place.
- name: Read the current desktop entry of apps with declared repairs
  ansible.builtin.slurp:
    src: >-
      /home/{{ primary_user }}/.local/share/applications/{{
        item.file | regex_replace('\.appimage$', '.desktop') }}
  register: appimages_desktop_now
  become: false
  failed_when: false # a not-yet-integrated app simply has no entry
  loop: "{{ appimages | selectattr('desktop', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Flatten the desktop-entry repairs that are still needed
  ansible.builtin.set_fact:
    appimages_desktop_entries: >-
      {{ (appimages_desktop_entries | default([]))
         + (item.item.desktop | dict2items(key_name='option', value_name='value')
            | map('combine', {'file': item.item.file | regex_replace('\.appimage$', '.desktop')})
            | list) }}
  vars:
    icon_now: >-
      {{ ((item.content | default('') | b64decode
           | regex_search('(?m)^Icon=(.*)$', '\1'))
          | default([], true) | first | default('', true)) | trim }}
  loop: "{{ appimages_desktop_now.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.content is defined
    - not icon_now.startswith('/')

- name: Report repairs that upstream has since fixed
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }}: the AppImage ships its own icon again
      ({{ icon_now }}), so the `desktop:` override in host_vars is no longer
      applied and can be dropped.
  vars:
    icon_now: >-
      {{ ((item.content | default('') | b64decode
           | regex_search('(?m)^Icon=(.*)$', '\1'))
          | default([], true) | first | default('', true)) | trim }}
  loop: "{{ appimages_desktop_now.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.content is defined
    - icon_now.startswith('/')

- name: Restore the desktop-entry keys Gear Lever drops on update
  community.general.ini_file:
    path: "/home/{{ primary_user }}/.local/share/applications/{{ item.file }}"
    section: Desktop Entry
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  become: false
  loop: "{{ appimages_desktop_entries | default([]) }}"
  loop_control:
    label: "{{ item.file }} -> {{ item.option }}"

# Opt-in only (see install.yml). Runs after the update sources are written, so a
# freshly integrated app is update-aware immediately, and before the check below,
# so a filename mismatch surfaces in the same run.
- name: Download and integrate the missing AppImages
  ansible.builtin.include_tasks: install.yml
  when:
    - appimages | length > 0
    - appimages_install_missing | bool

# --- Manual gate ----------------------------------------------------------
# Without appimages_install_missing, integrating an AppImage stays a manual step
# (multi-hundred-MB binaries), so the role reports what is missing rather than
# silently doing nothing. The update source above is already written, so a later
# integration is picked up with no further work.
- name: Check which declared AppImages are present
  ansible.builtin.stat:
    path: "{{ appimages_dir }}/{{ item.file }}"
  register: appimage_files
  become: false
  loop: "{{ appimages }}"
  loop_control:
    label: "{{ item.name }}"

- name: Report AppImages that still need a one-time manual integration
  ansible.builtin.debug:
    msg: >-
      Not integrated yet: {{ missing | map(attribute='name') | join(', ') }}.
      Download each AppImage, then integrate it with:
      flatpak run it.mijorus.gearlever --integrate <downloaded-file> -y
      Gear Lever names the installed file after the app itself; if the result
      differs from the `file:` value in host_vars, correct host_vars to match.
  vars:
    missing: "{{ appimage_files.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
  when: missing | length > 0

# --- Verification ---------------------------------------------------------
# Ask Gear Lever what it actually resolves, instead of trusting that writing the
# config was enough. This catches the two failure modes that are otherwise silent
# — an app that reports no update manager looks exactly like one that never had a
# source configured:
#
#   * the update source was dropped behind our back. The GUI's "Reload metadata"
#     does precisely this (see the README), so a mismatch here is expected after
#     poking at an app in Gear Lever — this run has already repaired it, and the
#     assertion just confirms the repair landed;
#   * the file name drifted away from `file:` in host_vars. The update config is
#     keyed by md5 of the AppImage's path, so a stale `file:` writes a perfectly
#     valid section under a hash nothing ever looks up.
#
# Only integrated apps are checked; ones still missing are reported above.
- name: Ask Gear Lever which update manager it resolves for each app
  ansible.builtin.command: flatpak run it.mijorus.gearlever --list-installed --json
  become: false
  changed_when: false
  register: appimages_verify
  when: appimages | length > 0

- name: Verify every integrated AppImage resolves its declared update manager
  ansible.builtin.assert:
    that:
      - actual | length == 1
      - actual[0].manager == item.manager
      - actual[0].path == (appimages_dir ~ '/' ~ item.file)
    fail_msg: >-
      {{ item.name }}: Gear Lever resolves
      '{{ actual[0].manager | default('no update manager', true) }}' at
      '{{ actual[0].path | default('?', true) }}', but host_vars declares
      '{{ item.manager }}' at '{{ appimages_dir }}/{{ item.file }}'.
      {{ hint_dropped if actual[0].manager != item.manager else hint_renamed }}
    success_msg: "{{ item.name }} -> {{ item.manager }}"
    quiet: true
  vars:
    installed: "{{ (appimages_verify.stdout | from_json).installed }}"
    actual: "{{ installed | selectattr('name', 'eq', item.name) | list }}"
    hint_dropped: >-
      Something dropped the update source after this role wrote it — the GUI's
      "Reload metadata" button does exactly that. Re-run the role.
    hint_renamed: >-
      Gear Lever renamed the file, so the config was written under an md5 nothing
      looks up. Correct `file:` in host_vars to the path above.
  loop: "{{ appimages }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - appimages_verify is not skipped
    - item.name in (installed | map(attribute='name') | list)
