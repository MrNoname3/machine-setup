---
- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload
  changed_when: true
  become: true
  listen: Apply udev rules

- name: Re-apply udev rules to connected USB devices
  ansible.builtin.command: udevadm trigger --subsystem-match=usb --action=change
  changed_when: true
  become: true
  listen: Apply udev rules
