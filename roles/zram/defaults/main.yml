---
# The zram swap device: the most it holds before compression (a
# zram-generator expression; Fedora's default), and its compression.
zram_size: min(ram, 8192)
zram_compression: zstd

# Swap settings for swap that lives in memory (the Arch wiki's zram values):
# swap idle pages out rather than drop the page cache, read no neighbouring
# swap pages ahead, no extra reclaim after fragmentation, and background
# reclaim that starts earlier. They matter only under memory pressure.
zram_sysctl:
  vm.swappiness: 180
  vm.page-cluster: 0
  vm.watermark_boost_factor: 0
  vm.watermark_scale_factor: 125
