---
# journal role: cap the disk use of the systemd journal and of kept core
# dumps. It needs root, so a run without it (the desktop's day-to-day
# `-e ansible_become=false`) skips the role with a notice.

- name: Check whether this run has root
  ansible.builtin.command: id -u
  register: journal_uid
  changed_when: false
  check_mode: false

- name: Note that the journal size was skipped (no root)
  ansible.builtin.debug:
    msg: >-
      The journal role needs root, so it was skipped. Run it with:
      ./scripts/apply.sh {{ inventory_hostname }} --tags journal -K
  when: journal_uid.stdout != "0"

- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: journal_uid.stdout == "0"

- name: Cap the journal's disk use
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      [Journal]
      SystemMaxUse={{ journal_max_use }}
    owner: root
    group: root
    mode: "0644"
  when: journal_uid.stdout == "0"
  notify: Restart journald

# systemd-coredump reads its configuration for every crash, so no restart.
- name: Cap the kept core dumps' disk use
  when: journal_uid.stdout == "0"
  block:
    - name: Ensure the coredump drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/coredump.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the core dump cap
      ansible.builtin.copy:
        dest: /etc/systemd/coredump.conf.d/size.conf
        content: |
          [Coredump]
          MaxUse={{ journal_coredump_max_use }}
        owner: root
        group: root
        mode: "0644"
