---
# kde role: KDE Plasma (Wayland) desktop tweaks for the Bazzite host.
#
# What it does:
#   - Pins the audited System Settings choices (kde_config_settings in
#     defaults): Night Colour, NumLock, flat mouse profile, locale formats,
#     default browser, file-dialog behaviour, hot-corner off, ...
#   - Dolphin preferences — applied only while Dolphin is closed (it rewrites
#     dolphinrc on exit, which would clobber a live edit).
#   - "Remember Window Positions" kwin script at kde_rwp_version, from its
#     GitHub release, and the windows it leaves alone (kde_rwp_remember_never).
#   - "Window Places", a kwin script of this role's own (files/windowplaces):
#     the windows in kde_window_places open where they last closed.
#   - Applies the global look-and-feel with plasma-apply-lookandfeel (writing
#     the kdeglobals key alone would not pull in the colour scheme).
#   - Forces the on-screen input method OFF (kwinrc [Wayland] InputMethod=""):
#     Bazzite ships a full input-method stack and a stray click can enable the
#     Virtual Keyboard, which injects an accent/emoji candidate popup while
#     typing on a physical keyboard.
#   - Default applications (VLC for video, ...) and power-management timeouts.
#   - Masks the user services that should not start with the session (KDE Connect).
#   - Hides the uBlue greeting in new terminals (kde_user_motd).
#   - Enables mpris-proxy (BT headset media buttons).
#
# KConfig edits mostly take effect at the next Plasma login; KWin is told to
# reconfigure right away when something changed.

- name: KDE Plasma desktop tweaks (Wayland)
  when: ansible_facts['os_family'] != "Debian" # KDE/Fedora-atomic host only (not the Mint laptop)
  become: false # user-scoped config, no root needed
  vars:
    kde_conf_dir: "/home/{{ primary_user }}/.config"
    kde_rwp_dir: "/home/{{ primary_user }}/.local/share/kwin/scripts/rememberwindowpositions"
  block:

    - name: Disable the on-screen input method (Virtual Keyboard = None)
      # An empty [Wayland] InputMethod is what System Settings writes for
      # "None" (it stores the key with a [$d] marker; empty reads the same).
      community.general.ini_file:
        path: "{{ kde_conf_dir }}/kwinrc"
        section: Wayland
        option: InputMethod
        value: ""
        no_extra_spaces: true
        mode: "0644"
      register: kde_im_result

    - name: Apply the audited KDE settings (KConfig ini edits)
      community.general.ini_file:
        path: "{{ kde_conf_dir }}/{{ item.file }}"
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: true
        mode: "0644"
      loop: "{{ kde_config_settings }}"
      loop_control:
        label: "{{ item.file }} [{{ item.section }}] {{ item.option }}"
      register: kde_cfg_result

    # --- Dolphin: only while it is closed (it rewrites dolphinrc on exit) ---
    - name: Check whether Dolphin is running
      ansible.builtin.command: pgrep -x dolphin
      register: kde_dolphin_running
      changed_when: false
      failed_when: false

    - name: Apply the Dolphin preferences
      community.general.ini_file:
        path: "{{ kde_conf_dir }}/{{ item.file }}"
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: true
        mode: "0644"
      loop: "{{ kde_dolphin_settings }}"
      loop_control:
        label: "[{{ item.section }}] {{ item.option }}"
      when: kde_dolphin_running.rc != 0

    - name: Warn that Dolphin settings were skipped because Dolphin is running
      ansible.builtin.debug:
        msg: Dolphin is running, so its preferences were not applied. Close it and re-run.
      when: kde_dolphin_running.rc == 0

    # --- Global look-and-feel (Breeze Dark) ---
    - name: Read the current look-and-feel package
      ansible.builtin.command: grep -E '^LookAndFeelPackage=' {{ kde_conf_dir }}/kdeglobals
      register: kde_lnf_current
      changed_when: false
      failed_when: false

    - name: Apply the look-and-feel (theme + colour scheme)
      ansible.builtin.command: "plasma-apply-lookandfeel -a {{ kde_lookandfeel }}"
      changed_when: true # guarded below: runs only when the current value differs
      when: kde_lnf_current.stdout != 'LookAndFeelPackage=' + kde_lookandfeel

    # --- Remember Window Positions kwin script, at kde_rwp_version ---
    - name: Read the installed Remember Window Positions version
      ansible.builtin.slurp:
        src: "{{ kde_rwp_dir }}/metadata.json"
      register: kde_rwp_metadata
      failed_when: false

    - name: Download the Remember Window Positions release
      ansible.builtin.get_url:
        url: "{{ kde_rwp_package_url }}"
        dest: "/tmp/rememberwindowpositions-{{ kde_rwp_version }}.kwinscript"
        mode: "0644"
      when: kde_rwp_installed_version != kde_rwp_version

    # KWin keeps a loaded script's QML cached, so a new release runs from the
    # next login on.
    - name: Install the Remember Window Positions release
      ansible.builtin.command: >-
        kpackagetool6 --type KWin/Script {{ '--upgrade' if kde_rwp_installed_version else '--install' }}
        /tmp/rememberwindowpositions-{{ kde_rwp_version }}.kwinscript
      changed_when: true # runs only when the installed version differs
      when: kde_rwp_installed_version != kde_rwp_version

    # A KDE Store install leaves an entry there, and "Get New..." would offer
    # the Store's release over kde_rwp_version.
    - name: Check for the KDE Store registry of kwin scripts
      ansible.builtin.stat:
        path: "/home/{{ primary_user }}/.local/share/knewstuff3/kwinscripts.knsregistry"
      register: kde_rwp_knsregistry

    - name: Drop the script from the KDE Store registry
      community.general.xml:
        path: "{{ kde_rwp_knsregistry.stat.path }}"
        xpath: /hotnewstuffregistry/stuff[contains(installedfile, '/kwin/scripts/rememberwindowpositions/')]
        state: absent
      when: kde_rwp_knsregistry.stat.exists

    - name: Read the Remember Window Positions settings
      ansible.builtin.slurp:
        src: "{{ kde_rwp_settings }}"
      register: kde_rwp_settings_file
      failed_when: false

    # The script reads its overrides when it loads and writes them back when it
    # unloads, so the handlers change the file only while the script is unloaded.
    - name: Check the script's overrides for the windows it leaves alone
      ansible.builtin.debug:
        msg: "{{ kde_rwp_overrides }}"
      changed_when: kde_rwp_overrides != kde_rwp_overrides_current
      notify:
        - Unload the Remember Window Positions script
        - Write the Remember Window Positions overrides
        - Load the Remember Window Positions script again

    # --- Window Places kwin script (kde_window_places) ---
    # KWin caches a loaded script's QML, so a changed main.qml runs from the
    # next login on; changed targets take effect on the handler's reload.
    - name: Install the Window Places script
      ansible.builtin.copy:
        src: windowplaces/
        dest: "/home/{{ primary_user }}/.local/share/kwin/scripts/windowplaces/"
        mode: "0644"
        directory_mode: "0755"
      notify: Reload the Window Places script

    - name: Set the windows Window Places keeps
      community.general.ini_file:
        path: "{{ kde_conf_dir }}/kwinrc"
        section: Script-windowplaces
        option: targets
        value: "{{ kde_window_places | to_json }}"
        no_extra_spaces: true
        mode: "0644"
      notify: Reload the Window Places script

    # --- Make KWin pick up changed settings without waiting for a re-login ---
    - name: Reconfigure KWin
      ansible.builtin.command: >-
        gdbus call --session --dest org.kde.KWin
        --object-path /KWin --method org.kde.KWin.reconfigure
      environment:
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['user_uid'] }}/bus"
      changed_when: false
      failed_when: false # no running session (e.g. fresh install) is fine
      when: kde_im_result is changed or kde_cfg_result is changed

    - name: Set the default applications (user MIME associations)
      community.general.ini_file:
        path: "{{ kde_conf_dir }}/mimeapps.list"
        section: Default Applications
        option: "{{ item.key }}"
        value: "{{ item.value }}"
        no_extra_spaces: true
        mode: "0644"
      loop: >-
        {{ kde_mime_defaults | combine(dict(kde_video_mimetypes
           | product([kde_video_player]))) | dict2items }}
      loop_control:
        label: "{{ item.key }}"

    - name: Keep unwanted user services from starting with the session
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        scope: user
        masked: true
      loop: "{{ kde_masked_user_units }}"

    - name: Hide the uBlue terminal greeting
      ansible.builtin.copy:
        dest: "{{ kde_conf_dir }}/no-show-user-motd"
        content: ""
        mode: "0644"
      when: not kde_user_motd

    - name: Show the uBlue terminal greeting
      ansible.builtin.file:
        path: "{{ kde_conf_dir }}/no-show-user-motd"
        state: absent
      when: kde_user_motd

    - name: Enable mpris-proxy (media keys / MPRIS for Bluetooth devices)
      # Bridges MPRIS players to Bluetooth AVRCP so BT headset buttons control
      # the desktop's media playback.
      ansible.builtin.systemd_service:
        name: mpris-proxy.service
        scope: user
        enabled: true
        state: started
