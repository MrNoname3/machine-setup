---
# disk-health role: smartd watches every drive, systemd timers start the SMART
# self-tests and scrub every mounted btrfs filesystem, and a problem becomes a
# desktop notification (replayed at the next login if nobody was logged in).
# The timers find the drives and filesystems when they run, so a new one is
# covered without another playbook run. It needs root, so a run without it (the
# desktop's day-to-day `-e ansible_become=false`) skips the role with a notice.

- name: Check whether this run has root
  ansible.builtin.command: id -u
  register: disk_health_uid
  changed_when: false
  check_mode: false

- name: Note that disk health monitoring was skipped (no root)
  ansible.builtin.debug:
    msg: >-
      The disk-health role needs root, so it was skipped. Run it with:
      ./scripts/apply.sh {{ inventory_hostname }} --tags disk-health -K
  when: disk_health_uid.stdout != "0"

- name: Set up disk health monitoring
  when: disk_health_uid.stdout == "0"
  vars:
    # Debian names the config and the service differently from Fedora.
    disk_health_smartd_conf: >-
      {{ '/etc/smartd.conf' if ansible_facts['os_family'] == 'Debian' else '/etc/smartmontools/smartd.conf' }}
    disk_health_smartd_service: >-
      {{ 'smartmontools' if ansible_facts['os_family'] == 'Debian' else 'smartd' }}
  block:
    # The recommended mail transport is left out: warnings go to the desktop.
    - name: Install smartmontools and notify-send (Debian)
      ansible.builtin.apt:
        name:
          - smartmontools
          - libnotify-bin
        state: present
        install_recommends: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Ensure the script directory exists
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        mode: "0755"

    - name: Install the notification and self-test scripts
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /usr/local/libexec/{{ item }}
        owner: root
        group: root
        mode: "0755"
      loop:
        - disk-health-notify
        - disk-health-smartd
        - disk-health-selftest
        - disk-health-scrub

    - name: Install the login-time alert replay
      ansible.builtin.copy:
        src: disk-health-alerts
        dest: /usr/local/bin/disk-health-alerts
        owner: root
        group: root
        mode: "0755"

    - name: Replay the alerts at every graphical login
      ansible.builtin.copy:
        src: disk-health-alerts.desktop
        dest: /etc/xdg/autostart/disk-health-alerts.desktop
        owner: root
        group: root
        mode: "0644"

    - name: Install the smartd configuration writer
      ansible.builtin.template:
        src: disk-health-smartd-conf.j2
        dest: /usr/local/libexec/disk-health-smartd-conf
        owner: root
        group: root
        mode: "0755"
      notify: Restart smartd

    - name: Ensure the smartd unit's drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/{{ disk_health_smartd_service }}.service.d
        state: directory
        mode: "0755"

    - name: Write smartd's configuration before every start
      ansible.builtin.copy:
        dest: /etc/systemd/system/{{ disk_health_smartd_service }}.service.d/disk-health.conf
        content: |
          [Service]
          ExecStartPre=/usr/local/libexec/disk-health-smartd-conf {{ disk_health_smartd_conf }}
        owner: root
        group: root
        mode: "0644"
      register: disk_health_smartd_dropin
      notify: Restart smartd

    - name: Install the self-test, scrub and failure units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/systemd/system/{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop:
        - disk-health-selftest@.service
        - disk-health-scrub.service
        - disk-health-failed@.service
      register: disk_health_units

    - name: Install the self-test timers
      ansible.builtin.template:
        src: disk-health-selftest.timer.j2
        dest: /etc/systemd/system/disk-health-selftest-{{ item.kind }}.timer
        owner: root
        group: root
        mode: "0644"
      loop:
        - { kind: short, when: "{{ disk_health_selftest_short }}" }
        - { kind: long, when: "{{ disk_health_selftest_long }}" }
      loop_control:
        label: "{{ item.kind }}"
      register: disk_health_selftest_timers

    - name: Install the scrub timer
      ansible.builtin.template:
        src: disk-health-scrub.timer.j2
        dest: /etc/systemd/system/disk-health-scrub.timer
        owner: root
        group: root
        mode: "0644"
      register: disk_health_scrub_timer

    # Earlier runs scheduled one scrub per filesystem (disk-health-scrub@<uuid>).
    - name: Find the per-filesystem scrub timers
      ansible.builtin.find:
        paths: /etc/systemd/system/timers.target.wants
        patterns: disk-health-scrub@*.timer
        file_type: link
      register: disk_health_old_scrub_timers

    - name: Stop and disable the per-filesystem scrub timers
      ansible.builtin.systemd_service:
        name: "{{ item.path | basename }}"
        enabled: false
        state: stopped
      loop: "{{ disk_health_old_scrub_timers.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Remove the per-filesystem scrub units
      ansible.builtin.file:
        path: /etc/systemd/system/{{ item }}
        state: absent
      loop:
        - disk-health-scrub@.service
        - disk-health-scrub@.timer
      register: disk_health_old_scrub_units

    - name: Reload systemd after a unit change
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: >-
        disk_health_units is changed or disk_health_selftest_timers is changed
        or disk_health_scrub_timer is changed or disk_health_old_scrub_units is changed
        or disk_health_smartd_dropin is changed

    - name: Run smartd
      ansible.builtin.systemd_service:
        name: "{{ disk_health_smartd_service }}"
        enabled: true
        state: started

    - name: Enable the self-test timers
      ansible.builtin.systemd_service:
        name: disk-health-selftest-{{ item }}.timer
        enabled: true
        state: started
      loop: [short, long]

    - name: Enable the scrub timer
      ansible.builtin.systemd_service:
        name: disk-health-scrub.timer
        enabled: true
        state: started
