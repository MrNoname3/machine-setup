---
- name: Restart smartd
  ansible.builtin.systemd_service:
    name: "{{ 'smartmontools' if ansible_facts['os_family'] == 'Debian' else 'smartd' }}"
    state: restarted

# A disk keeps its power settings only until it next powers up; this sets them now.
- name: Apply the hard disks' power settings
  ansible.builtin.command: >-
    {{ '/usr/lib/pm-utils/power.d/95hdparm-apm resume' if ansible_facts['os_family'] == 'Debian'
       else '/usr/local/libexec/disk-health-hdd-power' }}
  changed_when: true

- name: Reload the udev rules
  ansible.builtin.command: udevadm control --reload
  changed_when: true
