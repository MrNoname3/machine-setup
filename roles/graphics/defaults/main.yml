---
# Disable both analog VGA outputs on the kernel command line (Mint laptop: the
# unrouted connector reports a phantom monitor).
graphics_disable_vga: false

# The proprietary NVIDIA driver branch to install on a Mint host, e.g. "580".
# Empty leaves the GPU to the open drivers.
graphics_nvidia_branch: ""

# Install nvidia-vaapi-driver on such a host, for hardware video decoding in
# Chromium-based browsers (see tasks/nvidia-vaapi.yml).
graphics_nvidia_vaapi: false

# The oldest nvidia-vaapi-driver whose direct backend works with Chromium. The
# Ubuntu base's archive provides it once it reaches this version, the PPA below
# until then (its key: files/nvidia-vaapi-ppa.asc).
graphics_nvidia_vaapi_version: "0.0.18"
graphics_nvidia_vaapi_ppa: https://ppa.launchpadcontent.net/ubuntuhandbook1/nvidia-vaapi/ubuntu

# AMD GPU tuning (Bazzite / amdgpu). Empty default = the role does no GPU tuning
# unless the host defines profiles; see host_vars/desktop-bazzite/main.yml.
#
# Each profile is a voltage offset in mV (negative = undervolt, 0 = none) plus a
# board power cap in watts. Values are host-specific and must be MEASURED, not
# copied: the safe undervolt depends on the individual chip, and the useful cap
# depends on where that chip's frequency curve flattens out. The role README
# documents how the numbers below were arrived at.
amdgpu_profiles: {}

# Which profile is applied at boot. Switching temporarily needs no Ansible run:
#   sudo amdgpu-tune performance          # or: systemctl start amdgpu-tune@performance
# Change this value and re-run the role to make a different profile the default.
amdgpu_active_profile: ""

# OverDrive is off in the stock driver, so the voltage offset does not exist as
# a control until this kernel argument is set and the machine has rebooted.
#
# 0xfff7ffff is the stock default (0xfff7bfff) plus PP_OVERDRIVE_MASK (0x4000)
# and nothing else. The 0xffffffff seen in most guides ALSO re-enables
# PP_GFX_DCS_MASK (0x80000), which AMD disables deliberately -- there is no
# reason to take that along just to get a voltage offset.
amdgpu_ppfeaturemask: "0xfff7ffff"

# Set false to leave the kernel argument alone (e.g. to keep a machine stock
# while still shipping the profiles for later use).
amdgpu_enable_overdrive: true

# Start the login screen's KWin with Qt's hash seed fixed at 0. amdgpu offers
# RGBA8888 for scanout but rejects it, and KWin picks among equally ranked
# formats in QHash order, which Qt otherwise randomises on every start.
amdgpu_greeter_fixed_hash_seed: false

# Mesa from the kisak-mesa "fresh" PPA instead of the Ubuntu base's (Mint
# hosts). Turning it off removes the repository but keeps the packages it
# installed; `sudo ppa-purge ppa:kisak/kisak-mesa` goes back to Ubuntu's.
mesa_kisak_ppa: false

# nouveau rebuilt through DKMS with the patches in files/nouveau-patched. Each
# changes only the GPUs it names, and every other GPU keeps stock behaviour; the
# cards and what they need are listed in README.md.
nouveau_patched: false

# The pstate nouveau sets when it loads and after every runtime resume, as its
# hex id, or "" to keep the boot clocks until one is written to debugfs:
#   echo 0f | sudo tee /sys/kernel/debug/dri/*/pstate
# A GPU without that pstate, or without reclocking, stays at its boot clocks.
nouveau_pstate: ""

# The firmware of the video decoders of GeForce 8 to 300 and later cards,
# extracted on the host from NVIDIA's 340 driver (it may not be redistributed)
# into /lib/firmware/nouveau. Without it nouveau leaves video decoding off.
nouveau_video_firmware: false
nouveau_firmware_driver_url: https://us.download.nvidia.com/XFree86/Linux-x86_64/340.108/NVIDIA-Linux-x86_64-340.108.run
nouveau_firmware_driver_sha256: c671d4f1b7c09bc1af079b98b447adb06d704b04f802f7045a611fa50133b71b
nouveau_firmware_extractor_url: >-
  https://raw.githubusercontent.com/envytools/firmware/a0b9f9be0efad90cc84b8b2eaf587c3d7d350ea9/extract_firmware.py
nouveau_firmware_extractor_sha256: b684b37b69a78f58fb3a6cf73684698a65927e701adedbae736ddbb0d1768ea7

# false disables the GPU's copy engines, and nouveau moves buffers between
# VRAM and system memory with the graphics engine's M2MF instead.
nouveau_copy_engines: true
