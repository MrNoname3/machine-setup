---
# nvidia-vaapi-driver: VA-API on top of NVDEC, the only way Chromium-based
# browsers decode video in hardware on the proprietary driver. It comes from the
# Ubuntu base's archive once that reaches graphics_nvidia_vaapi_version, and from
# the graphics_nvidia_vaapi_ppa PPA until then.

# The role's former local build: versioned <version>~local1, which outranks the
# PPA's package of the same version.
- name: Read the installed nvidia-vaapi-driver version
  ansible.builtin.command: dpkg-query -W -f=${Version} nvidia-vaapi-driver
  register: nvidia_vaapi_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove the locally built nvidia-vaapi-driver
  ansible.builtin.apt:
    name: nvidia-vaapi-driver
    state: absent
  when: "'~local' in nvidia_vaapi_installed.stdout"

- name: Remove the local build's cache
  ansible.builtin.file:
    path: /var/cache/nvidia-vaapi-driver
    state: absent

- name: Look up the available nvidia-vaapi-driver versions
  ansible.builtin.command: apt-cache madison nvidia-vaapi-driver
  register: nvidia_vaapi_madison
  changed_when: false
  check_mode: false

- name: Decide between the archive and the PPA
  ansible.builtin.set_fact:
    nvidia_vaapi_archive_ok: >-
      {{ nvidia_vaapi_madison.stdout_lines
         | reject('search', graphics_nvidia_vaapi_ppa | regex_escape)
         | map('split', '|') | map(attribute=1) | map('trim')
         | map('regex_replace', '-[^-]*$', '')
         | select('version', graphics_nvidia_vaapi_version, '>=')
         | list | length > 0 }}

- name: Install nvidia-vaapi-driver from the PPA
  when: not (nvidia_vaapi_archive_ok | bool)
  block:
    # Mint reports its own codename; the PPA is built for the Ubuntu base's.
    - name: Read the Ubuntu base release
      ansible.builtin.slurp:
        src: /etc/os-release
      register: nvidia_vaapi_os_release

    - name: Ensure the apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install the nvidia-vaapi PPA signing key
      ansible.builtin.copy:
        src: nvidia-vaapi-ppa.asc
        dest: /etc/apt/keyrings/nvidia-vaapi-ppa.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add the nvidia-vaapi apt repository (deb822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nvidia-vaapi-ppa.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ graphics_nvidia_vaapi_ppa }}
          Suites: {{ nvidia_vaapi_os_release.content | b64decode | regex_findall('^UBUNTU_CODENAME=([a-z]+)$', multiline=True) | first }}
          Components: main
          Signed-By: /etc/apt/keyrings/nvidia-vaapi-ppa.asc

    - name: Install nvidia-vaapi-driver from the PPA
      ansible.builtin.apt:
        name: nvidia-vaapi-driver
        state: latest  # noqa: package-latest -- follows the PPA's releases
        update_cache: true

- name: Install nvidia-vaapi-driver from the archive
  when: nvidia_vaapi_archive_ok | bool
  block:
    - name: Remove the nvidia-vaapi apt repository
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/nvidia-vaapi-ppa.sources
        - /etc/apt/keyrings/nvidia-vaapi-ppa.asc

    - name: Install nvidia-vaapi-driver from the archive
      ansible.builtin.apt:
        name: nvidia-vaapi-driver
        state: latest  # noqa: package-latest -- replaces the PPA's package
        update_cache: true

    # Reported as a change, so no run ends with changed=0 until the role drops the PPA.
    - name: Report that the nvidia-vaapi PPA is no longer needed
      ansible.builtin.debug:
        msg: >-
          The archive now ships nvidia-vaapi-driver {{ graphics_nvidia_vaapi_version }}
          or later, so the role installed that and removed the PPA. The PPA's
          tasks (roles/graphics/tasks/nvidia-vaapi.yml), its key
          (files/nvidia-vaapi-ppa.asc) and graphics_nvidia_vaapi_ppa can go.
      changed_when: true

# The direct backend talks to the NVIDIA kernel module through its internal
# interface, so a driver update can break it; this catches that.
- name: Install vainfo
  ansible.builtin.apt:
    name: vainfo
    state: present

- name: Find the NVIDIA render node
  ansible.builtin.shell: |
    for node in /sys/class/drm/renderD*; do
      [ "$(basename "$(readlink -f "$node/device/driver")")" = nvidia ] && echo "/dev/dri/${node##*/}" && break
    done
    true
  register: nvidia_vaapi_node
  changed_when: false
  check_mode: false

# A driver installed by this run, as before or after a card swap, takes the
# card at the next boot.
- name: Look for a GPU the NVIDIA driver has taken
  ansible.builtin.find:
    paths: /sys/bus/pci/drivers/nvidia
    patterns: "0000:*"
    file_type: link
  register: nvidia_vaapi_bound

- name: Note that VA-API is checked after a reboot
  ansible.builtin.debug:
    msg: >-
      No GPU runs on the NVIDIA driver yet, so VA-API was not checked.
      Reboot and run the role again.
  when: nvidia_vaapi_bound.matched == 0

- name: Query VA-API on the NVIDIA GPU
  ansible.builtin.command:
    argv: [vainfo, --display, drm, --device, "{{ nvidia_vaapi_node.stdout }}"]
  register: nvidia_vaapi_vainfo
  changed_when: false
  failed_when: false
  check_mode: false
  when: nvidia_vaapi_node.stdout | length > 0

- name: Require VA-API to decode through nvidia-vaapi-driver
  ansible.builtin.assert:
    that:
      - nvidia_vaapi_node.stdout | length > 0
      - "'VA-API NVDEC driver' in nvidia_vaapi_vainfo.stdout"
      - "'VAProfileH264High' in nvidia_vaapi_vainfo.stdout"
    fail_msg: >-
      VA-API does not decode through nvidia-vaapi-driver
      ({{ nvidia_vaapi_vainfo.stdout_lines | default([]) | select('search', 'Driver version|error|failed') | join('; ')
          | default('no NVIDIA render node', true) }}). After an NVIDIA driver
      update this usually means a newer nvidia-vaapi-driver is needed.
    quiet: true
  when:
    - not ansible_check_mode
    - nvidia_vaapi_bound.matched > 0
