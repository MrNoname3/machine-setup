---
# graphics role: per-GPU fixes and tuning, split by OS family the same way the
# brave role is:
#
#   Mint laptop     -- NVIDIA GT 520M (Fermi) + Intel HD 3000 Optimus: kill the
#                      phantom VGA display.
#   Mint, nouveau   -- nouveau rebuilt with the local patches (GT 520M
#                      reclocking, Tesla push buffer reads, pre-Kepler copy
#                      engine channel, moving a buffer in use), and its pstate.
#   Mint desktop    -- the proprietary NVIDIA driver, where graphics_nvidia_branch
#                      is set, and VA-API video decoding for Chromium browsers
#                      on top of it (nvidia-vaapi.yml).
#   Bazzite desktop -- Radeon RX 9070 XT (Navi 48 / RDNA4): undervolt and power
#                      profiles. See README.md for how the numbers were measured.
#
# The Bazzite half needs root (it writes /usr/local/bin and /etc/systemd/system),
# so it cannot run under the `-e ansible_become=false` invocation the other
# Bazzite roles use:
#   ./scripts/apply.sh desktop-bazzite --tags graphics -K

# --- Mint laptop: phantom VGA output ---------------------------------------
# An unrouted analog VGA connector floats and is wrongly reported "connected",
# making the desktop extend onto a non-existent 1024x768 monitor. Because the
# DRM card enumeration order swaps between boots (nouveau <-> i915), the ghost
# appears on either VGA-1 or VGA-2, so we disable BOTH VGA outputs at the kernel
# level.
# NOTE: this also disables the laptop's physical VGA port for real monitors;
# remove the relevant video=...:d if you ever need to drive a VGA display.
- name: Disable phantom VGA outputs via the kernel cmdline (both GPUs)
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?!.*{{ item | regex_escape }}).*?)"$'
    replace: '\1 {{ item }}"'
  loop:
    - "video=VGA-1:d"
    - "video=VGA-2:d"
  notify: Update grub
  when:
    - ansible_facts['os_family'] == "Debian"
    - graphics_disable_vga | bool

# --- Mint desktop: proprietary NVIDIA driver --------------------------------
# The package blacklists nouveau and enables nvidia_drm modesetting; the
# module is built by DKMS against the installed kernel headers. Steam's 32-bit
# games need the i386 GL library besides the 64-bit one.
- name: Install the proprietary NVIDIA driver
  ansible.builtin.apt:
    name:
      - "nvidia-driver-{{ graphics_nvidia_branch }}"
      - "libnvidia-gl-{{ graphics_nvidia_branch }}:i386"
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - graphics_nvidia_branch | length > 0

# The driver's packages blacklist nouveau, so a host whose card moved to nouveau
# loses them; graphics_nvidia_branch installs them again.
- name: Remove the proprietary NVIDIA driver from a nouveau host
  when:
    - ansible_facts['os_family'] == "Debian"
    - graphics_nvidia_branch | length == 0
    - nouveau_patched | bool
  block:
    - name: List the proprietary NVIDIA driver's packages
      ansible.builtin.shell: >-
        set -o pipefail;
        dpkg-query -W -f='${db:Status-Abbrev}|${binary:Package}|${source:Package}\n'
        | awk -F'|' '$1 ~ /^.i/ && $3 ~ /^nvidia-graphics-drivers-/ {print $2}'
      args:
        executable: /bin/bash
      register: graphics_nvidia_installed
      changed_when: false
      check_mode: false

    - name: Purge the proprietary NVIDIA driver's packages
      ansible.builtin.apt:
        name: "{{ graphics_nvidia_installed.stdout_lines }}"
        state: absent
        purge: true
      when: graphics_nvidia_installed.stdout_lines | length > 0
      notify: Update initramfs # it carries the blacklist too

# The driver's EGL leaks a sync_file descriptor in the compositor for every
# frame; under the default limit Cinnamon on Wayland crashes within minutes.
# An hourly check warns before the raised limit runs out; logging out frees them.
- name: Raise the session's open-file limit past the driver's leak
  when:
    - ansible_facts['os_family'] == "Debian"
    - graphics_nvidia_branch | length > 0
  block:
    - name: Raise the primary user's soft open-file limit
      ansible.builtin.copy:
        dest: /etc/security/limits.d/90-nvidia-sync-file-leak.conf
        content: "{{ primary_user }} soft nofile 524288\n"
        owner: root
        group: root
        mode: "0644"

    - name: Install notify-send
      ansible.builtin.apt:
        name: libnotify-bin
        state: present

    - name: Install the compositor's open-file check
      ansible.builtin.copy:
        src: compositor-fd-watch
        dest: /usr/local/bin/compositor-fd-watch
        owner: root
        group: root
        mode: "0755"

    - name: Install the check's user units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/user/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - compositor-fd-watch.service
        - compositor-fd-watch.timer

    - name: Run the check hourly in every user's session
      ansible.builtin.systemd_service:
        name: compositor-fd-watch.timer
        enabled: true
        scope: global

- name: Hardware video decoding for Chromium browsers (nvidia-vaapi-driver)
  ansible.builtin.include_tasks: nvidia-vaapi.yml
  when:
    - ansible_facts['os_family'] == "Debian"
    - graphics_nvidia_branch | length > 0
    - graphics_nvidia_vaapi | bool

# --- Mint: Mesa from the kisak-mesa PPA -------------------------------------
# Upgrades only the Mesa packages already installed, both architectures; later
# PPA releases arrive with the system's regular updates.
- name: Use Mesa from the kisak-mesa PPA
  when:
    - ansible_facts['os_family'] == "Debian"
    - mesa_kisak_ppa | bool
  block:
    # Mint reports its own codename; the PPA is built for the Ubuntu base's.
    - name: Read the Ubuntu base release
      ansible.builtin.slurp:
        src: /etc/os-release
      register: graphics_os_release

    - name: Ensure the apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install the kisak-mesa signing key
      ansible.builtin.copy:
        src: kisak-mesa.asc
        dest: /etc/apt/keyrings/kisak-mesa.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add the kisak-mesa apt repository (deb822)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kisak-mesa.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://ppa.launchpadcontent.net/kisak/kisak-mesa/ubuntu
          Suites: {{ graphics_os_release.content | b64decode | regex_findall('^UBUNTU_CODENAME=([a-z]+)$', multiline=True) | first }}
          Components: main
          Signed-By: /etc/apt/keyrings/kisak-mesa.asc

    - name: List the installed Mesa packages
      ansible.builtin.command:
        argv: [dpkg-query, -W, '-f=${binary:Package} ${source:Package} ${db:Status-Want}\n']
      register: graphics_dpkg_sources
      changed_when: false
      check_mode: false

    # A held Mesa is patched-debs' rebuild, which follows the PPA itself.
    - name: Upgrade Mesa from the PPA
      ansible.builtin.apt:
        name: "{{ graphics_mesa_lines | map('split', ' ') | map('first') | list }}"
        state: latest
        only_upgrade: true
        update_cache: true
      when: graphics_mesa_lines | select('search', ' hold$') | length == 0
      vars:
        graphics_mesa_lines: "{{ graphics_dpkg_sources.stdout_lines | select('search', ' mesa ') | list }}"

- name: Remove the kisak-mesa apt repository
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/kisak-mesa.sources
    - /etc/apt/keyrings/kisak-mesa.asc
  when:
    - ansible_facts['os_family'] == "Debian"
    - not (mesa_kisak_ppa | bool)

# --- Mint: nouveau with the local patches ----------------------------------
# Each patch changes only the GPUs it names, so a card can move between hosts
# that have this on. The patched build comes from the Ubuntu source of the
# running kernel (prepare.sh fetches and verifies it), and DKMS rebuilds it for
# later kernels of the same series; a new series keeps its stock nouveau until
# the role runs again under it.
- name: Build nouveau with the local patches
  when:
    - ansible_facts['os_family'] == "Debian"
    - nouveau_patched | bool
  vars:
    nouveau_config: >-
      {{ (['NvClkMode=0x' ~ nouveau_pstate] if nouveau_pstate | length > 0 else [])
         + ([] if nouveau_copy_engines | bool else ['ce0=0', 'ce1=0']) }}
  block:
    - name: Install what the DKMS build needs
      ansible.builtin.apt:
        name:
          - dkms
          - build-essential
          - curl
          - gpgv
          - xz-utils
          - patch
          - python3
          - ubuntu-keyring
          - "linux-headers-{{ ansible_facts['kernel'] }}"
        state: present

    - name: List the builds of nouveau-gf108
      ansible.builtin.command: dkms status nouveau-gf108
      register: nouveau_gf108_versions
      changed_when: false
      check_mode: false

    # Both install nouveau.ko into updates/dkms.
    - name: Remove the builds of nouveau-gf108
      ansible.builtin.command: dkms remove {{ item }} --all
      loop: >-
        {{ nouveau_gf108_versions.stdout_lines
           | map('regex_replace', '[,:].*$', '') | unique | list }}
      changed_when: true
      notify: Update initramfs

    - name: Find the source trees of nouveau-gf108
      ansible.builtin.find:
        paths: /usr/src
        patterns: "nouveau-gf108-*"
        file_type: directory
      register: nouveau_gf108_trees

    - name: Remove the files of nouveau-gf108
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ nouveau_gf108_trees.files | map(attribute='path') | list
           + ['/usr/local/share/nouveau-gf108', '/etc/modprobe.d/nouveau-gf108.conf'] }}
      notify: Update initramfs

    - name: Install the patches and the source preparation script
      ansible.builtin.copy:
        src: nouveau-patched/
        dest: /usr/local/share/nouveau-patched/
        owner: root
        group: root
        mode: preserve

    - name: Find the patches installed earlier
      ansible.builtin.find:
        paths: /usr/local/share/nouveau-patched
        patterns: "0*.patch"
      register: nouveau_patched_installed

    # prepare.sh applies every 0*.patch it finds beside itself.
    - name: Remove patches the role no longer ships
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ nouveau_patched_installed.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: >-
        item.path | basename not in
        lookup('ansible.builtin.fileglob', 'nouveau-patched/0*.patch', wantlist=True) | map('basename')

    - name: Read the patch set's digest
      ansible.builtin.shell: >-
        set -o pipefail &&
        cat /usr/local/share/nouveau-patched/0*.patch | sha256sum | cut -c1-8
      args:
        executable: /bin/bash
      register: nouveau_patched_digest
      changed_when: false
      check_mode: false

    - name: Read the running kernel's source version
      ansible.builtin.command: >-
        dpkg-query -W -f='${source:Version}' linux-modules-{{ ansible_facts['kernel'] }}
      register: nouveau_patched_srcver
      changed_when: false
      check_mode: false

    - name: Name the DKMS module version
      ansible.builtin.set_fact:
        nouveau_patched_base: "nouveau-patched/{{ nouveau_patched_srcver.stdout | replace('~', '-') }}"
        nouveau_patched_dkms: >-
          nouveau-patched/{{ nouveau_patched_srcver.stdout | replace('~', '-') }}-{{ nouveau_patched_digest.stdout }}

    - name: List the versions DKMS has
      ansible.builtin.command: dkms status nouveau-patched
      register: nouveau_patched_versions
      changed_when: false
      check_mode: false

    # The same kernel source with another patch set; other series keep theirs.
    - name: Pick the builds of other patch sets
      ansible.builtin.set_fact:
        nouveau_patched_stale: >-
          {{ nouveau_patched_versions.stdout_lines
             | map('regex_replace', '[,:].*$', '') | unique
             | select('match', '^' ~ (nouveau_patched_base | regex_escape) ~ '(-[0-9a-f]{8})?$')
             | reject('equalto', nouveau_patched_dkms) | list }}

    - name: Remove the builds of other patch sets
      ansible.builtin.command: dkms remove {{ item }} --all
      loop: "{{ nouveau_patched_stale }}"
      changed_when: true
      notify: Update initramfs

    - name: Remove the source trees of other patch sets
      ansible.builtin.file:
        path: "/usr/src/{{ item | replace('/', '-') }}"
        state: absent
      loop: "{{ nouveau_patched_stale }}"

    - name: Prepare the DKMS source tree
      ansible.builtin.command: >-
        /usr/local/share/nouveau-patched/prepare.sh {{ ansible_facts['kernel'] }} /usr/src
      args:
        creates: "/usr/src/{{ nouveau_patched_dkms | replace('/', '-') }}/dkms.conf"

    - name: Add the tree to DKMS
      ansible.builtin.command: dkms add {{ nouveau_patched_dkms }}
      args:
        creates: "/var/lib/dkms/{{ nouveau_patched_dkms }}/source"

    - name: Check whether the module is installed for the running kernel
      ansible.builtin.command: >-
        dkms status {{ nouveau_patched_dkms }} -k {{ ansible_facts['kernel'] }}
      register: nouveau_patched_status
      changed_when: false
      check_mode: false

    - name: Build and install the module for the running kernel
      ansible.builtin.command: >-
        dkms install {{ nouveau_patched_dkms }} -k {{ ansible_facts['kernel'] }}
      when: "': installed' not in nouveau_patched_status.stdout"
      changed_when: true
      notify: Update initramfs

    # nouveau reads its config at load, and applies the pstate again whenever
    # the GPU comes back from runtime power-off.
    - name: Set the nouveau config options
      ansible.builtin.copy:
        dest: /etc/modprobe.d/nouveau-patched.conf
        content: "options nouveau config={{ nouveau_config | join(',') }}\n"
        owner: root
        group: root
        mode: "0644"
      when: nouveau_config | length > 0
      notify: Update initramfs

    - name: Leave nouveau's config at its defaults
      ansible.builtin.file:
        path: /etc/modprobe.d/nouveau-patched.conf
        state: absent
      when: nouveau_config | length == 0
      notify: Update initramfs

# A host whose card no longer needs the patches goes back to the kernel's nouveau.
- name: Remove nouveau's local patches
  when:
    - ansible_facts['os_family'] == "Debian"
    - not (nouveau_patched | bool)
  block:
    - name: Check whether the patched nouveau is installed
      ansible.builtin.stat:
        path: /usr/local/share/nouveau-patched
      register: nouveau_patched_share

    - name: List the builds of the patched nouveau
      ansible.builtin.command: dkms status nouveau-patched
      register: nouveau_patched_left
      changed_when: false
      check_mode: false
      when: nouveau_patched_share.stat.exists

    - name: Remove the builds of the patched nouveau
      ansible.builtin.command: dkms remove {{ item }} --all
      loop: >-
        {{ nouveau_patched_left.stdout_lines | default([])
           | map('regex_replace', '[,:].*$', '') | unique | list }}
      changed_when: true
      notify: Update initramfs

    - name: Find the source trees of the patched nouveau
      ansible.builtin.find:
        paths: /usr/src
        patterns: "nouveau-patched-*"
        file_type: directory
      register: nouveau_patched_trees

    - name: Remove the files of the patched nouveau
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ nouveau_patched_trees.files | map(attribute='path') | list
           + ['/usr/local/share/nouveau-patched', '/etc/modprobe.d/nouveau-patched.conf'] }}
      notify: Update initramfs

# --- Mint: nouveau video firmware -------------------------------------------
# The video engines run firmware that only NVIDIA's driver carries and that may
# not be redistributed, so it is taken out of the driver on the host itself,
# with envytools' extractor; both downloads are checked against their SHA-256.
- name: Install the nouveau video firmware
  when:
    - ansible_facts['os_family'] == "Debian"
    - nouveau_video_firmware | bool
  block:
    - name: Check whether the video firmware is installed
      ansible.builtin.stat:
        path: /lib/firmware/nouveau/nva3_bsp
      register: nouveau_firmware_present

    - name: Extract the video firmware from NVIDIA's driver
      when: not nouveau_firmware_present.stat.exists
      block:
        - name: Create a directory to extract the driver in
          ansible.builtin.tempfile:
            state: directory
            suffix: nouveau-firmware
          register: nouveau_firmware_tmp

        - name: Download NVIDIA's driver
          ansible.builtin.get_url:
            url: "{{ nouveau_firmware_driver_url }}"
            dest: "{{ nouveau_firmware_tmp.path }}/driver.run"
            checksum: "sha256:{{ nouveau_firmware_driver_sha256 }}"
            mode: "0644"

        - name: Download envytools' firmware extractor
          ansible.builtin.get_url:
            url: "{{ nouveau_firmware_extractor_url }}"
            dest: "{{ nouveau_firmware_tmp.path }}/extract_firmware.py"
            checksum: "sha256:{{ nouveau_firmware_extractor_sha256 }}"
            mode: "0644"

        - name: Unpack the driver
          ansible.builtin.command: sh driver.run --extract-only
          args:
            chdir: "{{ nouveau_firmware_tmp.path }}"
          changed_when: true

        - name: Extract the firmware
          ansible.builtin.command: python3 -I extract_firmware.py
          args:
            chdir: "{{ nouveau_firmware_tmp.path }}"
          changed_when: true

        - name: Install the extracted firmware
          ansible.builtin.shell: |
            set -e
            install -d -m 0755 /lib/firmware/nouveau
            find . -maxdepth 1 \( -name 'nv*_*' -o -name 'vuc-*' \) -exec cp -P {} /lib/firmware/nouveau/ \;
            test -e /lib/firmware/nouveau/nva3_bsp
          args:
            chdir: "{{ nouveau_firmware_tmp.path }}"
          changed_when: true

      always:
        - name: Remove the extracted driver
          ansible.builtin.file:
            path: "{{ nouveau_firmware_tmp.path }}"
            state: absent
          when: nouveau_firmware_tmp.path is defined

# --- Bazzite desktop: amdgpu tuning ----------------------------------------
- name: Configure AMD GPU tuning profiles
  when:
    - ansible_facts['os_family'] != "Debian"
    - amdgpu_profiles | length > 0
  block:

    # Without PP_OVERDRIVE_MASK the pp_od_clk_voltage interface does not exist
    # and the voltage offset is simply unavailable -- the power cap still works.
    # rpm-ostree stages this for the next boot; --unchanged-exit-77 is what keeps
    # a converged run green.
    - name: Enable the OverDrive bit in amdgpu's feature mask
      ansible.builtin.command: >-
        rpm-ostree kargs
        --append-if-missing=amdgpu.ppfeaturemask={{ amdgpu_ppfeaturemask }}
        --unchanged-exit-77
      register: amdgpu_karg
      changed_when: amdgpu_karg.rc == 0
      failed_when: amdgpu_karg.rc not in [0, 77]
      when: amdgpu_enable_overdrive | bool

    - name: Install the profile applier
      ansible.builtin.copy:
        src: amdgpu-tune
        dest: /usr/local/bin/amdgpu-tune
        owner: root
        group: root
        mode: "0755"

    - name: Ensure the profile config directory exists
      ansible.builtin.file:
        path: /etc/amdgpu-tune
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the tuning profiles
      ansible.builtin.template:
        src: profiles.conf.j2
        dest: /etc/amdgpu-tune/profiles.conf
        owner: root
        group: root
        mode: "0644"

    - name: Install the tuning units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - "amdgpu-tune@.service"
        - amdgpu-tune-resume.service
      notify: Reload systemd

    - name: Flush handlers so the units exist before they are enabled
      ansible.builtin.meta: flush_handlers

    # Volatile sysfs values do not survive a suspend/resume cycle, and nothing
    # would report that they were lost.
    - name: Re-apply the active profile after resume
      ansible.builtin.systemd_service:
        name: amdgpu-tune-resume.service
        enabled: true

    # Enabling one profile has to disable the others first, or two of them would
    # fight over the same sysfs values on the next boot in whatever order systemd
    # happens to pick.
    - name: Disable the profiles that are not selected
      ansible.builtin.systemd_service:
        name: "amdgpu-tune@{{ item }}.service"
        enabled: false
      loop: "{{ amdgpu_profiles.keys() | list }}"
      when: item != amdgpu_active_profile

    - name: Select the boot-time profile
      ansible.builtin.systemd_service:
        name: "amdgpu-tune@{{ amdgpu_active_profile }}.service"
        enabled: true
        state: started
      when: amdgpu_active_profile | length > 0

    - name: Report that the kernel argument needs a reboot
      ansible.builtin.debug:
        msg: >-
          amdgpu.ppfeaturemask was just added to the kernel command line. Until
          this machine reboots, pp_od_clk_voltage does not exist and only the
          power cap part of profile '{{ amdgpu_active_profile }}' is in effect.
      when:
        - amdgpu_enable_overdrive | bool
        - amdgpu_karg is defined
        - amdgpu_karg.changed

# --- Notes ---
# - nouveau manual reclocking is NOT possible on this GT 520M (GF108/NVC1):
#   writing /sys/kernel/debug/dri/<bdf>/pstate returns ENOSYS ("Function not
#   implemented"), and the falcon firmware (nvc1_fuc084) is missing. The GPU is
#   stuck at pstate 07 (202/324 MHz); 0f (672/800) is unreachable. Known nouveau
#   limitation for many Fermi laptop GPUs — do not retry.
