# All hosts run locally (no SSH). Select the target with: -l <host>
[laptops]
laptop-old ansible_connection=local

[desktops]
desktop-bazzite ansible_connection=local
desktop-phenom ansible_connection=local

[tablets]
tablet-miix ansible_connection=local

# A host's NVIDIA card: move the host between these groups when the card changes.
# A card on the proprietary 580 branch (group_vars/nvidia_580.yml).
[nvidia_580]

# A GeForce 8 to 300 card on nouveau (group_vars/nouveau_tesla.yml).
[nouveau_tesla]
desktop-phenom

# Group used by site.yml for encryption-related roles.
[encrypted]
laptop-old
desktop-phenom
