# Sourced by grubsrcd.cfg ahead of its own Memtest86+ entry, which is an
# x86_64 binary and cannot start under 32-bit UEFI firmware.
if [ "$grub_cpu" = "i386" ]; then
    menuentry 'Memtest86+ memory tester for 32-bit UEFI' {
        set gfxpayload=800x600,1024x768
        linux /EFI/memtest-ia32.efi keyboard=both
    }
fi
