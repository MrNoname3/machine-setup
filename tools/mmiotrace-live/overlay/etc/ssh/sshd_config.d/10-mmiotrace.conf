# sshd keeps the first value it reads, so these win over sshd_config itself.
PasswordAuthentication no
PermitRootLogin prohibit-password
# Only the host key build.sh bakes in, so every boot presents the same identity.
HostKey /etc/ssh/ssh_host_ed25519_key
# Root, from private networks (RFC 1918) only.
AllowUsers root@10.0.0.0/8 root@172.16.0.0/12 root@192.168.0.0/16
