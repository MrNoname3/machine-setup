# mmiotrace sees only the mappings a driver makes after tracing starts, so the
# NVIDIA driver loads only by hand: modprobe --ignore-install nvidia.
# nouveau is blacklisted by the driver package.
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
# Xorg's EGL vendor probing loads nvidia by name, which a blacklist does not stop.
install nvidia /bin/false
