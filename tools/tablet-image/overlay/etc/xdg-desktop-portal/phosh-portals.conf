# Debian 13's xdg-desktop-portal-phosh crashes on start, which leaves every
# portal unanswered; the GTK backend serves the same interfaces.
[preferred]
default=gtk;
org.freedesktop.impl.portal.Access=phosh-shell;
org.freedesktop.impl.portal.Background=none;
org.freedesktop.impl.portal.Secret=gnome-keyring;
