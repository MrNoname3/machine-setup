# The Crystal Cove PMIC switches the DSI panel's power, so its GPIO driver has
# to be there first; the prep script lets i915 take over the firmware's mode
# instead of a full modeset, which hangs this machine. The initramfs (where
# plymouth brings in i915) has no prep script, so i915 waits for the root fs.
install i915 /sbin/modprobe gpio_crystalcove && /usr/local/sbin/vlv-dsi-fastset-prep && /sbin/modprobe --ignore-install i915 $CMDLINE_OPTS
