# Lenovo Miix 2 8 (DMI 20326 / Hiking): Atom Z3740, 32-bit UEFI, DSI panel.
# Sourced by build.sh. Firmware names refer to files in TI_FIRMWARE, which the
# README says how to extract; they are not redistributable and stay out of git.

# The firmware does not hand i915 its Video BIOS Table; this is the one its GOP
# uses for the MS_9003 panel.
VBT=miix2-8-vbt-217.bin

# source-in-TI_FIRMWARE:destination-in-image
FIRMWARE=(
  "BCM4324B3_002.004.006.0130.0138.hcd:/usr/lib/firmware/brcm/BCM4324B3.hcd"
)

# The ISP and both camera sensors; Debian does not build atomisp, so
# build-atomisp.sh prepares it from this kernel release for DKMS.
ATOMISP_TAG=v6.12.111
FIRMWARE+=("shisp_2400b0_v21.bin:/usr/lib/firmware/intel/ipu/shisp_2400b0_v21.bin")
PACKAGES_EXTRA=(v4l-utils)

# i915 lists DisplayPort and HDMI ports the tablet does not have and polls them.
CMDLINE="video=DP-1:d video=DP-2:d video=HDMI-A-1:d video=HDMI-A-2:d"
