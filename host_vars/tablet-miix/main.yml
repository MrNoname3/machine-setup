---
# Per-host settings for tablet-miix: a Lenovo Miix 2 8 running Debian 13 with
# Phosh, installed from the image tools/tablet-image builds. The image carries
# the hardware fixes, the desktop and the core applications; this playbook
# configures access, keeps track of /etc and adds the applications the system
# works without.
#
# Machine-local values (ssh_port) live in local.yml next to this file —
# untracked by git (see the pre_tasks in site.yml).

# Roles to apply on this host (the "switch" for site.yml).
roles_enabled:
  - base
  - ssh-access
  - brave
  - phosh
  - firewall
  - etckeeper

# The key the ssh-access role authorizes for primary_user (roles/ssh-access/files).
ssh_authorized_key_file: tablet.pub

# Packages the base role installs.
packages_present:
  - git
  - python3-venv                 # repo-local toolchain (scripts/ensure-venv.sh)
  - python3-psutil               # community.general.dconf (phosh role)
  - htop
  - portfolio-filemanager        # file manager made for phones and tablets
  - loupe                        # image viewer
  - gnome-calculator
  - gnome-text-editor

# Inbound: only SSH; the tablet runs no other network service.
firewall_allowed:
  - { port: "{{ ssh_port }}", proto: tcp, comment: "SSH" }

# Phosh session settings (phosh role).
phosh_dconf_settings:
  - { key: /org/gnome/desktop/interface/color-scheme, value: "'prefer-dark'" }
  - { key: /org/gnome/desktop/interface/show-battery-percentage, value: "true" }
  - { key: /org/gnome/desktop/wm/preferences/num-workspaces, value: "1" }
  # Every installed app in the app grid, not only the adaptive ones.
  - { key: /sm/puri/phosh/app-filter-mode, value: "@as []" }
  # The default favorites are phone apps the tablet does not have.
  - { key: /sm/puri/phosh/favorites, value: "@as []" }
  # Debian's wallpaper as image files: phosh cannot load the slideshow XML the
  # theme points to, and leaves the lock screen black.
  - key: /org/gnome/desktop/background/picture-uri
    value: "'file:///usr/share/desktop-base/ceratopsian-theme/wallpaper/contents/images/1280x800.svg'"
  - key: /org/gnome/desktop/background/picture-uri-dark
    value: "'file:///usr/share/desktop-base/ceratopsian-theme/wallpaper/contents/images/1280x800.svg'"
  - key: /org/gnome/desktop/screensaver/picture-uri
    value: "'file:///usr/share/desktop-base/ceratopsian-theme/lockscreen/contents/images/1280x800.svg'"

# Brave, with the laptop's policies and local preferences (brave role
# defaults) and a profile of its own.
brave_sync_gate: false
brave_flags:
  - "--ozone-platform=wayland"            # it looks for X11 otherwise and does not start
  - "--enable-wayland-ime"                # the on-screen keyboard
  - "--wayland-text-input-version=3"
brave_policies_extra:
  # enhanced-h264ify: YouTube sends H.264, which Brave decodes in software at
  # about two thirds of AV1's cost; Bay Trail's VA-API cannot serve Chromium.
  ExtensionInstallForcelist:
    - omkfmpieigblcllmkgbflkikinpkodlk
  # Features the tablet has no use for, off instead of only hidden.
  BraveNewsDisabled: true
  BraveTalkDisabled: true
  BravePlaylistEnabled: false
  BraveLocalAIEnabled: false
  BraveStatsPingEnabled: false
  # 2 GB of RAM and a slow CPU: inactive tabs are unloaded, and no page is
  # loaded before it is opened.
  HighEfficiencyModeEnabled: true
  MemorySaverModeSavings: 1
  NetworkPredictionOptions: 2

# phosh drops the windows' buttons at every start; the close button stays.
phosh_dconf_locked:
  - { key: /org/gnome/desktop/wm/preferences/button-layout, value: "'appmenu:close'" }
