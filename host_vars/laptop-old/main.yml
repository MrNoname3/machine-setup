---
# Per-host settings for laptop-old.
#
# Machine-local values (ssh_port, wg_home_gateway_macs, and
# optionally primary_user) live in local.yml next to this file — untracked by
# git. If a value needed by an enabled role is missing, the playbook prompts
# for it once and saves it there (see the pre_tasks in site.yml).

# Roles to apply on this host (the "switch" for site.yml).
roles_enabled:
  - base
  - ssh-access
  - printers       # the Samsung SCX-4x21 (printers below)
  - brave
  - git            # global git settings
  - synology-drive
  - steam
  - vscode
  - flatpaks       # Gear Lever (flatpak_apps below)
  - appimages      # Gear Lever's AppImage set + their update sources
  - lutris         # the Flatpak Lutris's game icons
  - luks-unlock
  - graphics
  - firewall
  - storage
  - wireguard
  - containers
  - journal        # cap the systemd journal
  - etckeeper
  - keyring

# The base role's Mint desktop defaults (roles/base/tasks/cinnamon.yml).
base_cinnamon: true

# Mint's umask is 002, so the apps write their config files as 0664.
user_config_mode: "0664"

# The key the ssh-access role authorizes for primary_user (roles/ssh-access/files).
ssh_authorized_key_file: laptop.pub

# Packages the base role installs.
packages_present:
  - git
  - python3-venv                 # repo-local toolchain (scripts/ensure-venv.sh)
  - htop
  - vlc
  - kate
  - breeze                       # Breeze widget style for Kate (base role sets it)
  - keepassxc
  - meld
  - numlockx                     # turn NumLock on at the LightDM greeter / boot
  - yaru-theme-icon              # Yaru cursor set (base role selects it via dconf)
  - cups                         # print server (Mint ships it; listed for clarity)
  - printer-driver-splix         # QPDL/SPL2 raster driver for Samsung SCX/ML/CLP (see printers)
  - flatpak                      # the flatpaks role (Mint ships it; listed for clarity)
  - libfuse2t64                  # FUSE 2 runtime of older AppImages (MQTT Explorer)

# Packages to ensure are removed. Keep entries here permanently so fresh
# installs stay clean. Never list a package in both lists.
packages_absent:
  # System-wide ansible — replaced by the repo-local .venv toolchain
  # (scripts/ensure-venv.sh); the venv-run playbook can remove it safely.
  - ansible
  - ansible-core
  # Browser / mail — using Brave + webmail
  - firefox
  - firefox-locale-en
  - thunderbird
  - thunderbird-locale-en
  - thunderbird-locale-en-us
  # Redundant / unused Mint default apps
  - celluloid                   # Mint video player (VLC is the default now)
  - hypnotix                    # Mint IPTV/TV player
  - warpinator                  # Mint LAN file transfer (we have Synology/SMB)
  - rhythmbox                   # music player (VLC covers it)
  - rhythmbox-data
  - rhythmbox-plugins
  - rhythmbox-plugin-tray-icon
  - pix                         # image organiser (xviewer stays as the viewer)
  - pix-data
  - sticky                      # sticky notes
  # Accessibility — not needed; brltty also hijacks USB-serial devices (bad for embedded dev)
  - onboard
  - onboard-common
  - orca
  - brltty
  - xbrlapi
  - mousetweaks
  # Misc unused apps (the panel clock/calendar is a Cinnamon applet, not gnome-calendar)
  - gnome-calendar
  - neofetch                    # cosmetic system-info printer
  - thingy                      # Mint document manager
  - mintchat                    # Mint community chat integration
  # Apple iOS device support (no Apple devices) + Mint welcome + char map
  - ideviceinstaller
  - ifuse
  - mintwelcome
  - gucharmap
  # Legacy network clients
  - telnet
  - inetutils-telnet
  - ftp
  - tnftp
  - rdate
  # Document Viewer — Brave handles PDFs; Nemo preview keeps the xreader libs
  - xreader
  - xreader-dbg
  # Mint default text editor — replaced by Kate as the default editor
  - xed
  - xed-dbg
  # Fingerprint auth — no fingerprint reader on this laptop; not active in PAM
  - fingwit
  - libpam-fingwit
  - fprintd
  - libpam-fprintd
  # System-audit cleanup (2026-07-04): unused services / live-ISO leftovers
  - casper                      # live-ISO boot only; useless once installed (also clears the failed casper-md5check unit)
  - cups-browsed                # network printer *browsing* — not needed with a USB printer (cups itself stays)
  - modemmanager                # no WWAN modem, and it grabs USB-serial ports (bad for embedded dev, like brltty)
  - touchegg                    # Cinnamon gestures are disabled and there is no touchegg config -> redundant
  # Real Docker engine — only ever pulled as a docker-compose-v2 *Recommends*; we
  # run rootless Podman (podman compose uses docker-compose-v2's provider directly,
  # so the compose tooling stays). The containers role installs with
  # install_recommends:false so these are not resurrected. Podman is independent
  # (crun/conmon/netavark, not containerd).
  - docker.io
  - containerd

# CUPS printers (printers role). The Samsung SCX-4x21 Series MFP is a Samsung QPDL
# device, so it must use splix's rastertoqpdl driver (PPD "Samsung SCX-4521F");
# the generic PCL-XL PPD the Mint dialog suggests prints nothing. The USB URI is
# auto-discovered from `lpinfo -v` (usb_match), so no serial is stored here.
printers:
  - name: Samsung-SCX-4x21-Series
    usb_match: "usb://Samsung/SCX-4x21"
    model: "drv:///splix-samsung.drv/scx4521f.ppd"
    model_nickname: "Samsung SCX-4521F"

# Flatpak application set (system scope, Flathub).
flatpak_apps:
  - it.mijorus.gearlever
  - net.lutris.Lutris            # Windows games outside Steam and Heroic

# Lutris's manifest grants the home directory but not the game disk.
flatpak_overrides:
  - { app: net.lutris.Lutris, filesystems: [/mnt/data] }

# The 500 GB HDD: LUKS2 with ext4, unlocked at boot by its keyfile (storage role;
# bootstrap in roles/storage/README.md).
storage_disks:
  - name: data
    device: PARTLABEL=data-crypt
    mountpoint: /mnt/data
    fstype: ext4
    opts: defaults,nofail,nosuid,nodev,x-gvfs-show

# AppImages integrated with Gear Lever. The schema, and why each update source
# is set the way it is, are documented in host_vars/desktop-bazzite/main.yml and
# roles/appimages/README.md. A fresh machine needs the whole playbook, which
# also installs Gear Lever:
#   ./scripts/apply.sh laptop-old -e appimages_install_missing=true
appimages:
  - name: MQTT Explorer
    file: mqtt_explorer.appimage
    manager: GithubUpdater
    config:
      repo: thomasnordquist/MQTT-Explorer
      repo_filename: "MQTT-Explorer-*.AppImage"
      # REQUIRED: the whole 0.4.x line is tagged pre-release.
      allow_prereleases: true
  - name: Logic                      # Saleae Logic 2 analyser software
    file: logic.appimage
    manager: StaticFileUpdater
    config:
      url: "https://logic2api.saleae.com/download?os=linux&arch=x64"
    # The AppImage's own desktop entry ships no Icon/Comment/Categories.
    desktop:
      Icon: logic-appimage
      Comment: Debug hardware like a pro
      Categories: Utility;
      StartupWMClass: Logic
    # The ids in the udev rules the AppImage ships (resources/udev/): the first
    # generation Logic and Logic16, then the current models.
    usb_devices: ["0925:3881", "21a9:1001", "21a9:1003", "21a9:1004", "21a9:1005", "21a9:1006", "21a9:1007"]
  - name: Radmin VPN                 # Windows Radmin VPN client under bundled Wine
    file: radmin_vpn.appimage
    manager: GithubUpdater
    config:
      repo: baptisterajaut/radmin-vpn-linux
      repo_filename: "RadminVPN-Linux-x86_64.AppImage"
      # Release candidates are published as pre-releases.
      allow_prereleases: false

# All UDP on radminvpn0, whose addresses are not RFC1918. Radmin peers check the
# tunnel on a UDP port the service takes from the kernel at each start, and the
# LAN games played over it host and browse on UDP. TCP stays closed.
firewall_interface_allowed:
  - { interface: radminvpn0, proto: udp, comment: "Radmin VPN peers and LAN games" }

# Steam's LAN features, from the private ranges only. The other client's reply
# to a discovery broadcast arrives on UDP 27036 and matches no outgoing flow.
firewall_allowed_extra:
  - { port: "27031:27036", proto: udp, comment: "Steam discovery + Remote Play" }
  - { port: "27036:27037", proto: tcp, comment: "Steam Remote Play" }
  - { port: "27040", proto: tcp, comment: "Steam local game transfers" }

# Podman is the only container engine here (no rootful Docker), so it is safe to
# export DOCKER_HOST to the rootless Podman socket for testcontainers / IDE
# docker plugins. NOT set on hosts that run a real Docker daemon (e.g. the
# desktop), where it would hijack the `docker` CLI.
container_docker_host_export: true

# No brave_flags: Brave cannot decode video in hardware on this X11 Optimus
# machine (VA-API lands on the nouveau render node, and decoded frames cannot
# be handed to GLX), so it decodes in software, which the CPU keeps up with.

# Remote LUKS unlock (dropbear) uses ip=dhcp; the address is pinned by a DHCP
# reservation on the router (external dependency, not captured in this repo —
# details in local.yml).

# --- Machine-local values (see local.yml) ---
# ssh_port                      hardened SSH port
# luks_root_uuid                crypto_LUKS partition UUID on the SSD
# unlock_pendrive_uuid          filesystem UUID of the home unlock pendrive
# wg_home_gateway_macs          trusted home default-gateway MAC(s); if the AP
#                               routes its own subnet (not bridge mode), add
#                               its gateway MAC as well
