---
# Per-host settings for desktop-bazzite (Bazzite / Fedora atomic, KDE Plasma).
#
# Onboarded incrementally by reverse-engineering the live system (rpm-ostree
# layers, flatpak list, brew leaves, fstab, user services). Mint-centric role
# branches are guarded by ansible_facts['os_family'] and skip here.

# Roles to apply on this host (the "switch" for site.yml).
roles_enabled:
  - brave           # rpm-ostree layered + policies/prefs (common tasks)
  - printers        # the Samsung SCX-4x21 (printers below)
  - flatpaks        # the app set below
  - appimages       # Gear Lever's AppImage set + their update sources
  - brew            # CLI tools below
  - git             # global git settings (+ the credential helper below)
  - synology-drive  # sync gate + home bind mounts (client via flatpaks)
  - steam           # autostart (Steam ships with the Bazzite image)
  - heroic          # ProtonPlus's GE-Proton as Heroic's default Wine
  - keyring         # KeePassXC as the SSH agent
  - graphics        # Radeon RX 9070 XT undervolt + power profiles
  - kde             # Plasma tweaks (audited System Settings) + user services
  - vscode          # user settings for the flatpak VS Code (install via flatpaks)
  - containers      # rootless Podman user services (stack ships with the image)
  - storage         # encrypted data disks (storage_disks below; needs root)
  - journal         # cap the systemd journal and core dumps (needs root)
  - connectivity-check  # no captive-portal probe to Fedora (needs root)
  - hostname        # static hostname below (needs root)
  - system-services     # unused services from the image (below; needs root)
  - disk-health     # SMART watch, self-tests, btrfs scrub (needs root)
  - system-updates  # uupd retries while the machine is busy (needs root)
  - zram            # swap settings for the image's zram swap (needs root)
  - system-disk     # TRIM + dm-crypt options of the system SSD (needs root)
  - firewall        # firewalld: LAN-only services (below; needs root)

# The image sets no static hostname, so without this the host takes the name
# the router's DNS holds for its address.
system_hostname: bazzite

# primary_user defaults to the running user (group_vars/all.yml); override in
# host_vars/desktop-bazzite/local.yml if it ever differs.

# Directory holding the IoT/device SSH private keys (OneDrive-synced).
# The keyring role generates a matching .pub next to every private key here.
ssh_keys_dir: "/home/{{ primary_user }}/SynologyDrive/OneDrive/IOT/SSH"

# On Bazzite /home is a symlink to /var/home, and /proc/mounts shows the
# RESOLVED path. The mount module compares fstab paths against /proc/mounts, so
# the bind mounts must be keyed by the canonical /var/home path here — with
# /home paths the module would consider them unmounted on every run and stack a
# new bind each time. (Regular file tasks keep using /home; only mount-state
# comparison cares.)
synology_home: "/var/home/{{ primary_user }}"

# The panel's task manager, left to right.
kde_panel_launchers:
  - applications:brave-browser.desktop
  - preferred://filemanager
  - applications:org.kde.konsole.desktop
  - applications:brave-eigpmdhekjlgjgcppnanaanbdmnlnagl-Default.desktop   # Outlook
  - applications:brave-ejhkdoiecgkmdpomoahkdihbcldkgjci-Default.desktop   # Element
  - applications:brave-jneocipojkkahfcibhjaiilegofacenn-Default.desktop   # Duolingo
  - applications:steam.desktop
  - applications:net.lutris.Lutris.desktop
  - applications:io.github.kolunmi.Bazaar.desktop

# The web apps above are installed by hand, not through brave_web_apps: Brave
# applies a policy to every profile, and this one has a work profile as well.

# Flatpak application set (system scope, Flathub). ProtonPlus is managed by the
# steam role (steam_flatpaks), so it is not repeated here.
flatpak_apps:
  # Documents / office / media
  - com.calibre_ebook.calibre
  - org.libreoffice.LibreOffice
  - org.kde.gwenview
  - org.kde.haruna
  - org.kde.kcalc
  - org.kde.filelight
  - org.videolan.VLC
  - org.gnome.meld
  - org.gnome.SimpleScan          # the Samsung SCX-4x21's scanner
  # 3D printing / EDA / CAD
  - com.prusa3d.PrusaSlicer
  - org.freecad.FreeCAD
  - org.kicad.KiCad
  # Gaming (Steam itself ships with the image)
  - com.github.Matoking.protontricks
  - com.heroicgameslauncher.hgl
  - com.usebottles.bottles
  - io.github.unknownskl.greenlight
  # Flatpak / app management
  - com.github.tchx84.Flatseal
  - io.github.flattool.Warehouse
  - it.mijorus.gearlever
  - com.ranfdev.DistroShelf
  # Tools / infra
  - com.synology.SynologyDrive
  - com.visualstudio.code
  - org.keepassxc.KeePassXC
  - org.virt_manager.virt-manager

# Bazzite's image installs these; Brave is the browser and the PDF viewer here.
flatpak_apps_absent:
  - org.mozilla.firefox
  - org.kde.okular

# Enabled by the image but unused here. Input Remapper holds no presets;
# `ujust restore-input-remapper enable` turns it back on (drop it from here and
# from kde_masked_user_units_extra too).
system_services_disabled:
  - input-remapper.service

# Its session autostart loads the presets through the service above, so it
# would fail at every login.
kde_masked_user_units_extra:
  - 'app-input\x2dremapper\x2dautoload@autostart.service'

flatpak_extensions:
  - { name: org.videolan.VLC.Plugin.pause_click, app: org.videolan.VLC, branch: "3-{runtime}" }  # click to pause

# Heroic finds Proton builds in Steam's compatibilitytools.d, where ProtonPlus
# installs them, but its manifest grants only ~/.steam, whose `steam` link points
# into ~/.local/share/Steam here.
flatpak_overrides:
  - app: com.heroicgameslauncher.hgl
    filesystems: ["~/.local/share/Steam/compatibilitytools.d:ro"]
  # The whole session bus for VS Code, and the whole host filesystem for
  # virt-manager, so installation media and disk images can live anywhere.
  - { app: com.visualstudio.code, sockets: [session-bus] }
  - { app: org.virt_manager.virt-manager, filesystems: [host] }

# Heroic lists Proton builds under the Steam library path in libraryfolders.vdf,
# which is the canonical /var/home one here; a default given by any other
# spelling shows up as a second entry.
heroic_steam_compat_dir: "/var/home/{{ primary_user }}/.local/share/Steam/compatibilitytools.d"
heroic_install_path: /mnt/data/Games/Heroic

# AppImages integrated with Gear Lever, with the update source each one needs.
# `file:` is the name Gear Lever gave the file in appimages_dir (it derives it
# from the AppImage's own desktop entry) — the update config is keyed by that
# path, so it has to match exactly. Verified against the live upstreams; see
# roles/appimages/README.md for how each source was chosen.
appimages:
  - name: Xodus Nexus               # Xbox-inspired Microsoft Store game launcher
    file: xodus_nexus.appimage
    manager: GithubUpdater
    config:
      repo: domsvoboda/xodus-nexus
      # The other releases publish its backend and runtime; this pattern selects
      # only the x86_64 launcher AppImage from the launcher release.
      repo_filename: "Xodus-Nexus-*-x86_64.AppImage"
      allow_prereleases: false
  - name: FlightCore                 # Northstar (Titanfall 2) mod manager
    file: flightcore.appimage
    manager: GithubUpdater
    config:
      repo: R2NorthstarTools/FlightCore
      repo_filename: "FlightCore_*_amd64.AppImage"
      # Upstream publishes only full releases, so /releases/latest is the right
      # endpoint — and it carries a sha256 digest, which beats a size compare.
      allow_prereleases: false
    # The AppImage's bundled libwayland-client does not work with the host's
    # Mesa EGL: WebKit aborts and the window stays white.
    env:
      LD_PRELOAD: /usr/lib64/libwayland-client.so.0
  - name: MQTT Explorer
    file: mqtt_explorer.appimage
    manager: GithubUpdater
    config:
      repo: thomasnordquist/MQTT-Explorer
      # Matches the arm64/armv7l assets too; Gear Lever discards those by
      # filename on an x86_64 host and keeps the plain (amd64) AppImage.
      repo_filename: "MQTT-Explorer-*.AppImage"
      # REQUIRED: the whole 0.4.x line is tagged pre-release, so the
      # /releases/latest endpoint would offer a *downgrade* to 0.3.5.
      allow_prereleases: true
  - name: Logic                      # Saleae Logic 2 analyser software
    file: logic.appimage
    manager: StaticFileUpdater
    config:
      # Redirects (302) to the current versioned AppImage and answers HEAD with
      # a content-length, which is what StaticFileUpdater compares against.
      url: "https://logic2api.saleae.com/download?os=linux&arch=x64"
    # Saleae regressed here in 2.4.45: the AppImage's internal desktop entry has
    # no Icon/Comment/Categories, and the archive carries no icon file at all, so
    # Gear Lever's update left a generic 'applications-other' icon and no menu
    # category. These keys restore what 2.4.44 shipped; the icon comes from
    # roles/appimages/files/icons/ and is referenced by NAME so that Gear Lever's
    # uninstall step cannot delete the file.
    desktop:
      Icon: logic-appimage
      Comment: Debug hardware like a pro
      Categories: Utility;
      StartupWMClass: Logic
    # The ids in the udev rules the AppImage ships (resources/udev/): the first
    # generation Logic and Logic16, then the current models.
    usb_devices: ["0925:3881", "21a9:1001", "21a9:1003", "21a9:1004", "21a9:1005", "21a9:1006", "21a9:1007"]
  - name: Radmin VPN                 # Windows Radmin VPN client under bundled Wine
    file: radmin_vpn.appimage
    manager: GithubUpdater
    config:
      repo: baptisterajaut/radmin-vpn-linux
      repo_filename: "RadminVPN-Linux-x86_64.AppImage"
      # Release candidates are published as pre-releases.
      allow_prereleases: false

# Radeon RX 9070 XT (Navi 48 / RDNA4) tuning. Every number here was measured on
# THIS card -- see roles/graphics/README.md for the method and the raw results.
# Do not copy these to another machine: the stable undervolt is a property of the
# individual chip.
#
# -100 mV is the knee of this chip's curve, not its limit. It held -160 mV in
# testing and hung at -180 mV, but the core clock stops rising at about -100
# (2591 MHz) and gains only 4 MHz more by -140 -- so everything below -100 buys
# risk without performance.
#
# Reference point: stock (0 mV, 317 W) scores 367 fps in the benchmark used.
amdgpu_profiles:
  performance:
    voffset: -100
    cap: 317
    note: "402 fps, +9.5% -- same heat and noise as stock, just faster"
  balanced:
    voffset: -100
    cap: 300
    note: "390 fps, +6.3% -- 17 W and 3 C below stock"
  efficient:
    voffset: -100
    cap: 280
    note: "371 fps, +1.1% -- stock speed for 37 W less, 5 C cooler, 660 rpm quieter"
  quiet:
    voffset: -100
    cap: 260
    note: "349 fps, -4.9% -- 80 C junction, 1590 rpm"
  eco:
    voffset: -100
    cap: 240
    note: "328 fps, -10.6% -- 79 C junction, 1358 rpm"
  minimal:
    voffset: -100
    cap: 221
    note: "313 fps, -14.7% -- the driver's lowest cap, 78 C, 1208 rpm"
  stock:
    voffset: 0
    cap: 317
    note: "no tuning at all -- for isolating the GPU when diagnosing something"

# Applied at boot. Switch temporarily without an Ansible run:
#   sudo amdgpu-tune performance
# and change this value (plus re-run the role) to move the default.
amdgpu_active_profile: efficient

# The LG on HDMI stays off in the session; lit on the login screen next to the
# DisplayPort monitor, it made the mouse and keyboard stutter there.
graphics_greeter_outputs_disabled:
  - HDMI-A-1

# Inbound services from the private ranges. No SSH server runs here, so of the
# defaults only mDNS stays.
firewall_allowed:
  - { port: "5353", proto: udp, comment: "mDNS/Avahi (NAS discovery)" }

# Steam's LAN features. The other client's reply to a discovery broadcast
# arrives on UDP 27036 and matches no outgoing flow.
firewall_allowed_extra:
  - { port: "27031:27036", proto: udp, comment: "Steam discovery + Remote Play" }
  - { port: "27036:27037", proto: tcp, comment: "Steam Remote Play" }
  - { port: "27040", proto: tcp, comment: "Steam local game transfers" }

firewall_interface_allowed:
  - { interface: radminvpn0, proto: udp, comment: "Radmin VPN peers and LAN games" }

# Pushes to the Gitea authenticate with a token kept by git's own store helper.
git_config_extra:
  credential.helper: store

# CUPS printers (printers role). The Samsung SCX-4x21 runs on Samsung's own ULD
# driver here, which the image ships; the queue keeps the name it was created with.
printers:
  - name: SCX-4x21-Series
    usb_match: "usb://Samsung/SCX-4x21"
    model: "uld/Samsung_SCX-4x21_Series.ppd.gz"
    model_nickname: "Samsung SCX-4x21 Series"

# Encrypted data disks (storage role; bootstrap in roles/storage/README.md).
# The 2 TB HDD is the main data disk (games, installers, backups); the 1 TB HDD
# is spare space.
storage_disks:
  - name: data
    device: PARTLABEL=data-crypt
    mountpoint: /var/mnt/data
    fstype: btrfs
    opts: noatime,compress=zstd:3,autodefrag,nofail,nosuid,nodev,x-gvfs-show,x-gvfs-name=Data
  - name: spare
    device: PARTLABEL=spare-crypt
    mountpoint: /var/mnt/spare
    fstype: btrfs
    opts: noatime,compress=zstd:3,autodefrag,nofail,nosuid,nodev,x-gvfs-show,x-gvfs-name=Spare

# Homebrew CLI tools (leaves — dependencies follow automatically).
brew_packages:
  - flashrom
  - htop
  - midnight-commander
  - anomalyco/tap/opencode-v2    # opencode coding agent, from its vendor's tap
