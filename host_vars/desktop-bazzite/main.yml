---
# Per-host settings for desktop-bazzite (Bazzite / Fedora atomic, KDE Plasma).
#
# Onboarded incrementally by reverse-engineering the live system (rpm-ostree
# layers, flatpak list, brew leaves, fstab, user services). Mint-centric role
# branches are guarded by ansible_facts['os_family'] and skip here.

# Roles to apply on this host (the "switch" for site.yml).
roles_enabled:
  - brave           # rpm-ostree layered + policies/prefs (common tasks)
  - flatpaks        # the app set below
  - appimages       # Gear Lever's AppImage set + their update sources
  - brew            # CLI tools below
  - synology-drive  # sync gate + home bind mounts (client via flatpaks)
  - steam           # autostart (Steam ships with the Bazzite image)
  - keyring         # KeePassXC as the SSH agent
  - kde             # Plasma tweaks (audited System Settings) + user services
  - vscode          # user settings for the flatpak VS Code (install via flatpaks)
  - containers      # rootless Podman user services (stack ships with the image)

# primary_user defaults to the running user (group_vars/all.yml); override in
# host_vars/desktop-bazzite/local.yml if it ever differs.

# Directory holding the IoT/device SSH private keys (OneDrive-synced).
# The keyring role generates a matching .pub next to every private key here.
ssh_keys_dir: "/home/{{ primary_user }}/SynologyDrive/OneDrive/IOT/SSH"

# On Bazzite /home is a symlink to /var/home, and /proc/mounts shows the
# RESOLVED path. The mount module compares fstab paths against /proc/mounts, so
# the bind mounts must be keyed by the canonical /var/home path here — with
# /home paths the module would consider them unmounted on every run and stack a
# new bind each time. (Regular file tasks keep using /home; only mount-state
# comparison cares.)
synology_home: "/var/home/{{ primary_user }}"

# Flatpak application set (system scope, Flathub). ProtonPlus is managed by the
# steam role (steam_flatpaks), so it is not repeated here.
flatpak_apps:
  # Documents / office / media
  - com.calibre_ebook.calibre
  - org.libreoffice.LibreOffice
  - org.kde.okular
  - org.kde.gwenview
  - org.kde.haruna
  - org.kde.kcalc
  - org.kde.filelight
  - org.videolan.VLC
  - org.gnome.meld
  # 3D printing / EDA / CAD
  - com.prusa3d.PrusaSlicer
  - org.freecad.FreeCAD
  - org.kicad.KiCad
  # Gaming (Steam itself ships with the image)
  - com.github.Matoking.protontricks
  - com.heroicgameslauncher.hgl
  - com.usebottles.bottles
  - io.github.unknownskl.greenlight
  # Flatpak / app management
  - com.github.tchx84.Flatseal
  - io.github.flattool.Warehouse
  - it.mijorus.gearlever
  - com.ranfdev.DistroShelf
  # Tools / infra
  - com.synology.SynologyDrive
  - com.visualstudio.code
  - org.keepassxc.KeePassXC
  - org.mozilla.firefox
  - org.virt_manager.virt-manager

# AppImages integrated with Gear Lever, with the update source each one needs.
# `file:` is the name Gear Lever gave the file in appimages_dir (it derives it
# from the AppImage's own desktop entry) — the update config is keyed by that
# path, so it has to match exactly. Verified against the live upstreams; see
# roles/appimages/README.md for how each source was chosen.
appimages:
  - name: FlightCore                 # Northstar (Titanfall 2) mod manager
    file: flightcore.appimage
    manager: GithubUpdater
    config:
      repo: R2NorthstarTools/FlightCore
      repo_filename: "FlightCore_*_amd64.AppImage"
      # Upstream publishes only full releases, so /releases/latest is the right
      # endpoint — and it carries a sha256 digest, which beats a size compare.
      allow_prereleases: false
  - name: MQTT Explorer
    file: mqtt_explorer.appimage
    manager: GithubUpdater
    config:
      repo: thomasnordquist/MQTT-Explorer
      # Matches the arm64/armv7l assets too; Gear Lever discards those by
      # filename on an x86_64 host and keeps the plain (amd64) AppImage.
      repo_filename: "MQTT-Explorer-*.AppImage"
      # REQUIRED: the whole 0.4.x line is tagged pre-release, so the
      # /releases/latest endpoint would offer a *downgrade* to 0.3.5.
      allow_prereleases: true
  - name: Logic                      # Saleae Logic 2 analyser software
    file: logic.appimage
    manager: StaticFileUpdater
    config:
      # Redirects (302) to the current versioned AppImage and answers HEAD with
      # a content-length, which is what StaticFileUpdater compares against.
      url: "https://logic2api.saleae.com/download?os=linux&arch=x64"
    # Saleae regressed here in 2.4.45: the AppImage's internal desktop entry has
    # no Icon/Comment/Categories, and the archive carries no icon file at all, so
    # Gear Lever's update left a generic 'applications-other' icon and no menu
    # category. These keys restore what 2.4.44 shipped; the icon comes from
    # roles/appimages/files/icons/ and is referenced by NAME so that Gear Lever's
    # uninstall step cannot delete the file.
    desktop:
      Icon: logic-appimage
      Comment: Debug hardware like a pro
      Categories: Utility;
      StartupWMClass: Logic
  - name: LM-Studio                  # local LLM runner; name has a '-' (see README)
    file: lm_studio.appimage
    manager: StaticFileUpdater
    config:
      url: "https://lmstudio.ai/download/latest/linux/x64?format=AppImage"

# Homebrew CLI tools (leaves — dependencies follow automatically).
brew_packages:
  - flashrom
  - htop
  - midnight-commander
  - node
  - pipx
  - podman-compose
