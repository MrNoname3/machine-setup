name: PPA sources

# Builds the PPA's source packages from the versions in
# tools/patched-deb/ppa-sources.yml, so a pull request that moves one (Renovate
# opens them) or changes a patch shows whether the patches still apply. Runs on
# Gitea's and GitHub's ubuntu-latest, both Ubuntu 24.04; Gitea's runs as root.
on:
  push:
    branches: [main]
    paths:
      - tools/patched-deb/**
      - .github/workflows/ppa.yml
  pull_request:
    paths:
      - tools/patched-deb/**
      - .github/workflows/ppa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the source packages
        env:
          DEBFULLNAME: CI
          DEBEMAIL: ci@localhost
        run: |
          if [ "$(id -u)" = 0 ]; then
            tools/patched-deb/ppa.sh check "$RUNNER_TEMP/ppa"
          else
            sudo --preserve-env=DEBFULLNAME,DEBEMAIL tools/patched-deb/ppa.sh check "$RUNNER_TEMP/ppa"
          fi
